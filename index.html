      <span class="text">
        <div class="title">Start Circuit Timer</div>
        <div class="sub">Guided rounds with countdown tones</div>
      </span>
    </button>
  `;
}

/* ---------------- Circuit (Circuit workouts; formerly "Cardio 4x4") ----------------
   A Circuit workout's Workout section holds its circuit: rounds, work and rest, and the exercises in order,
   saved on the workout as w.circuit = {rounds, workSeconds, restSeconds, exercises:[exerciseId]}. It is created
   on the first change, so opening a workout never writes anything. Start runs the circuit timer with it. */
const CIRCUIT_DEFAULT = { rounds:4, workSeconds:240, restSeconds:180 };
function isCircuitWorkout(w){ return !!w && (w.types||[]).includes('Circuit'); }
function getCircuit(w){ return w.circuit || { ...CIRCUIT_DEFAULT, exercises:[] }; }
function ensureCircuit(w){ if(!w.circuit) w.circuit = { ...CIRCUIT_DEFAULT, exercises:[] }; return w.circuit; }
function renderCircuitPanel(w){
  const panel = document.getElementById('circuitPanel'), addBtn = document.getElementById('mainAddBtn');
  if(!isCircuitWorkout(w)){ panel.classList.add('hidden'); panel.innerHTML=''; addBtn.classList.remove('hidden'); return; }
  addBtn.classList.add('hidden'); panel.classList.remove('hidden');
  if(w.main.length===0) document.getElementById('mainExercises').innerHTML = '';
  const c = getCircuit(w), n = c.exercises.length;
  const rows = n===0 ? `<div style="color:var(--muted); font-size:13.5px; padding:4px 2px 8px;">No exercises added yet.</div>` :
    c.exercises.map((exId,i)=>{ const def = getExerciseDef(exId); const name = def ? def.name : 'Unknown exercise';
      return `<div class="ct-picked-row"><div class="pos">${i+1}</div><div class="icon">${getExerciseIcon(name)}</div><div class="name">${escapeHtml(name)}</div>`+
        (i>0 ? `<div class="remove" onclick="circuitMove(${i},-1)" aria-label="Move up">▲</div>` : '')+
        `<div class="remove" onclick="circuitRemove(${i})">remove</div></div>`; }).join('');
  let summary = '';
  if(n){ const sched = buildSchedule({rounds:c.rounds, workSeconds:c.workSeconds, restSeconds:c.restSeconds, exerciseCount:n});
    summary = `Total session: <strong>${Math.round(sched.totalSeconds/60)} min</strong>. Each round, ${ctFmtMinSec(c.workSeconds/n)} per exercise before rest.`; }
  const stepper = (label,key,val,delta)=> `<div class="ct-config-row"><label>${label}</label><div class="ct-stepper"><button onclick="circuitAdjust('${key}',${-delta})">−</button><span class="ct-val">${val}</span><button onclick="circuitAdjust('${key}',${delta})">+</button></div></div>`;
  panel.innerHTML = `
    <div class="ct-section">
      ${stepper('Rounds','rounds',c.rounds,1)}
      ${stepper('Work (min:sec)','workSeconds',ctFmtMinSec(c.workSeconds),30)}
      ${stepper('Rest (min:sec)','restSeconds',ctFmtMinSec(c.restSeconds),30)}
    </div>
    <div class="ct-section">
      <h3>Circuit exercises</h3>
      ${rows}
      <button class="add-exercise-btn" onclick="circuitOpenPicker()">+ Add exercise to circuit</button>
      <div class="ct-summary">${summary}</div>
    </div>
    <button class="circuit-timer-btn" onclick="circuitStart()" ${n?'':'disabled style="opacity:.5"'}>
      <span class="icon">⏱️</span>
      <span class="text"><div class="title">${n ? `Start circuit · ${c.rounds} rounds` : 'Add an exercise to start'}</div><div class="sub">Guided rounds with countdown tones</div></span>
    </button>
    <button class="ct-test-sound" onclick="ctPlayTestTone()">🔊 Test sound</button>`;
}
function circuitAdjust(key, delta){
  const c = ensureCircuit(getWorkout());
  if(key==='rounds') c.rounds = Math.max(1, Math.min(12, c.rounds + delta));
  else if(key==='workSeconds') c.workSeconds = Math.max(30, Math.min(1800, c.workSeconds + delta));
  else if(key==='restSeconds') c.restSeconds = Math.max(0, Math.min(1800, c.restSeconds + delta));
  saveDB(); renderWorkout();
}
function circuitRemove(i){ const c = ensureCircuit(getWorkout()); c.exercises.splice(i,1); saveDB(); renderWorkout(); }
function circuitMove(i, d){ const c = ensureCircuit(getWorkout()); const j=i+d; if(j<0||j>=c.exercises.length) return; [c.exercises[i],c.exercises[j]]=[c.exercises[j],c.exercises[i]]; saveDB(); renderWorkout(); }
function circuitOpenPicker(){ openPicker('circuit'); } // same add-exercise sheet as the other sections
function circuitStart(){
  const c = getCircuit(getWorkout()); if(!c.exercises.length) return;
  Object.assign(ctConfig, { rounds:c.rounds, workSeconds:c.workSeconds, restSeconds:c.restSeconds, exercises:[...c.exercises] });
  openCircuitTimer(); ctStartSession();
}

/* ---------------- Exercise drag-to-reorder ---------------- */
let dragState = null; // { instId, fromBucket, ghostEl, placeholderEl, startY, currentY }

function wireUpExerciseDrag(){
  document.querySelectorAll('.exercise-card').forEach(cardEl=>{
    const instId = cardEl.dataset.instId;
    const fromBucket = cardEl.dataset.bucket;
    const isCollapsed = collapsedExercises.has(instId);
    if(!isCollapsed) return; // only draggable while collapsed, per spec
    cardEl.classList.add('reorderable');

    let pressTimer = null;
    let longPressFired = false;
    let movedPastThreshold = false;
    let startX = 0, startY = 0;
    const THRESHOLD = 10;

    const clearTimer = ()=>{ if(pressTimer){ clearTimeout(pressTimer); pressTimer = null; } };

    cardEl.addEventListener('touchstart', (e)=>{
      longPressFired = false;
      movedPastThreshold = false;
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
      pressTimer = setTimeout(()=>{
        longPressFired = true;
        if(navigator.vibrate) navigator.vibrate(10);
        beginDrag(cardEl, instId, fromBucket, e.touches[0].clientY);
      }, 420);
    }, {passive:true});

    cardEl.addEventListener('touchmove', (e)=>{
      const dx = Math.abs(e.touches[0].clientX - startX);
      const dy = Math.abs(e.touches[0].clientY - startY);
      if(!dragState && (dx > THRESHOLD || dy > THRESHOLD)){
        movedPastThreshold = true;
        clearTimer(); // moved before long-press fired -> this is a scroll, not a drag
      }
      if(dragState && dragState.instId===instId){
        e.preventDefault(); // we own this gesture now
        updateDrag(e.touches[0].clientY);
      }
    }, {passive:false});

    cardEl.addEventListener('touchend', ()=>{
      clearTimer();
      if(dragState && dragState.instId===instId){
        endDrag();
      }
    });
  });
}

function beginDrag(cardEl, instId, fromBucket, startClientY){
  window.getSelection?.()?.removeAllRanges(); // drop any text selection the long-press started
  document.documentElement.classList.add('dragging');
  const rect = cardEl.getBoundingClientRect();
  const ghost = cardEl.cloneNode(true);
  ghost.classList.add('drag-ghost');
  ghost.style.width = rect.width + 'px';
  ghost.style.top = rect.top + 'px';
  ghost.style.left = rect.left + 'px';
  document.body.appendChild(ghost);

  cardEl.classList.add('drag-source-hidden');

  const placeholder = document.createElement('div');
  placeholder.className = 'drag-placeholder';
  placeholder.style.height = rect.height + 'px';
  cardEl.parentNode.insertBefore(placeholder, cardEl);

  dragState = {
    instId, fromBucket,
    ghostEl: ghost,
    placeholderEl: placeholder,
    sourceEl: cardEl,
    offsetY: startClientY - rect.top,
    currentBucket: fromBucket
  };
}

function updateDrag(clientY){
  if(!dragState) return;
  dragState.ghostEl.style.top = (clientY - dragState.offsetY) + 'px';

  // Find which container and position we're hovering over
  const containers = [
    { key:'warmup', el: document.getElementById('warmupExercises') },
    { key:'main', el: document.getElementById('mainExercises') }
  ];
  let targetContainer = null;
  for(const c of containers){
    const rect = c.el.getBoundingClientRect();
    if(clientY >= rect.top - 20 && clientY <= rect.bottom + 20){ targetContainer = c; break; }
  }
  if(!targetContainer) return;

  dragState.currentBucket = targetContainer.key;
  const siblings = [...targetContainer.el.querySelectorAll('.exercise-card:not(.drag-source-hidden)')];
  let insertBefore = null;
  for(const sib of siblings){
    const sibRect = sib.getBoundingClientRect();
    if(clientY < sibRect.top + sibRect.height/2){ insertBefore = sib; break; }
  }
  if(insertBefore){
    if(dragState.placeholderEl.nextSibling !== insertBefore){
      targetContainer.el.insertBefore(dragState.placeholderEl, insertBefore);
    }
  } else {
    if(targetContainer.el.lastElementChild !== dragState.placeholderEl){
      targetContainer.el.appendChild(dragState.placeholderEl);
    }
  }
}

function endDrag(){
  if(!dragState) return;
  const { instId, fromBucket, currentBucket, ghostEl, placeholderEl, sourceEl } = dragState;

  // Determine final order from DOM: read the placeholder's position among siblings.
  // The original (now-hidden) source card is still physically in the DOM, so it must
  // be excluded here — otherwise instId appears twice and indexOf finds the stale spot.
  const w = getWorkout();
  const targetContainerEl = document.getElementById(currentBucket==='warmup' ? 'warmupExercises' : 'mainExercises');
  const orderedIds = [...targetContainerEl.children]
    .filter(el=> el!==sourceEl)
    .map(el=> el===placeholderEl ? instId : el.dataset.instId)
    .filter(Boolean);

  // Remove the instance from its original bucket array
  const fromArr = w[fromBucket];
  const idx = fromArr.findIndex(i=>i.id===instId);
  const [moved] = idx>-1 ? fromArr.splice(idx,1) : [null];

  if(moved){
    if(currentBucket===fromBucket){
      // Reinsert into the same array at the position implied by orderedIds
      const insertAt = orderedIds.indexOf(instId);
      fromArr.splice(Math.max(0,insertAt), 0, moved);
    } else {
      const toArr = w[currentBucket];
      const insertAt = orderedIds.indexOf(instId);
      toArr.splice(Math.max(0,insertAt), 0, moved);
    }
    saveDB();
  }

  ghostEl.remove();
  placeholderEl.remove();
  sourceEl.classList.remove('drag-source-hidden');
  document.documentElement.classList.remove('dragging');
  dragState = null;
  renderWorkout();
}

function renderExerciseBucket(containerId, bucket, bucketKey){
  const container = document.getElementById(containerId);
  if(bucket.length===0){
    container.innerHTML = `<div style="color:var(--muted); font-size:13px; padding:4px 4px 8px;">No exercises added yet.</div>`;
    return;
  }
  container.innerHTML = bucket.map(inst=>renderExerciseCard(inst, bucketKey)).join('');
}

            <button class="set-check ${s.done!==false?'on':''}" onclick="toggleSetDone('${inst.id}',${i})" aria-label="Mark set done">✓</button>

function setSummaryText(inst, secondaryType, bucketKey){
  if(!inst.sets || inst.sets.length===0) return 'No sets logged';
  const shown = inst.sets.filter(x=>x.done!==false);
  if(shown.length===0) return `Not started · ${inst.sets.length} set${inst.sets.length===1?'':'s'}`;
  const parts = shown.map(x=>escapeHtml(fmtSet(x, secondaryType))); // plain text: no band dot on the collapsed card
  // Progress delta is only meaningful for main-lift progressive overload — warmups/PT
  // work isn't tracked for "improvement" the same way, so skip it there.
  if(bucketKey==='warmup') return parts.join(', ');
  const delta = computeLoadDelta(inst, secondaryType);
  return parts.join(', ') + formatLoadDelta(delta);
}

function videoEmbedHtml(url){
  const ytId = extractYouTubeId(url);
  if(ytId){
    return `<iframe class="yt-embed" src="https://www.youtube.com/embed/${escapeHtml(ytId)}" allowfullscreen loading="lazy"></iframe>`;
  }
  if(isInstagramUrl(url)){
    // Instagram blocks bare iframe embedding without their oEmbed/JS SDK,
    // so show a clean tap-through card instead of a broken embed.
    // Store the URL in a data attribute (not inline onclick) to avoid any
    // possibility of the URL's contents breaking out of an HTML attribute.
    return `<div class="ig-card" data-ig-url="${escapeHtml(url)}" onclick="openIgLink(this)">
      <span class="ig-icon">▶</span><span>Open in Instagram</span>
    </div>`;
  }
  return '';
}
function openIgLink(el){
  const url = el.dataset.igUrl;
  if(url) window.open(url, '_blank');
}
function extractYouTubeId(url){
  try{
    const u = new URL(url);
    if(u.hostname.includes('youtu.be')) return u.pathname.slice(1);
    if(u.searchParams.get('v')) return u.searchParams.get('v');
    const m = u.pathname.match(/\/embed\/([^/?]+)/);
    if(m) return m[1];
  }catch(e){}
  return null;
}
function isInstagramUrl(url){
  try{
    const u = new URL(url);
    return u.hostname.includes('instagram.com');
  }catch(e){ return false; }
}
function escapeHtml(str){
  const d = document.createElement('div'); d.textContent = str ?? ''; return d.innerHTML;
}

/* ---------------- Scroll wheel component ---------------- */
const BAND_COLORS = ['red','yellow','black','green','orange','purple','blue'];
const WHEEL_OPTION_HEIGHT = 26;

function renderWheel(instId, setIdx, field, value, disabled, min, max, step, label, showLabel){
  const options = [];
  for(let v=min; v<=max; v+=step){
    options.push(Math.round(v*100)/100);
  }
  const current = (value===null || value===undefined) ? min : value;
  const wheelId = `wheel-${field}-${instId}-${setIdx}`;
  return `
    <div class="wheel-field">
      <div class="wheel-label ${showLabel?'':'wheel-label-hidden'}">${label}</div>
      <div class="wheel-frame">
      <div class="wheel-viewport ${disabled?'wheel-disabled':''}" id="${wheelId}"
           data-inst="${instId}" data-idx="${setIdx}" data-field="${field}"
           data-options='${JSON.stringify(options)}'>
        <div class="wheel-track">
          ${options.map(v=>`<div class="wheel-option" data-value="${v}">${v}</div>`).join('')}
        </div>
      </div>
      <div class="wheel-viewport-mask"></div>
      <div class="wheel-center-line"></div>
      </div>
    </div>
  `;
}

function renderBandWheel(instId, setIdx, value, disabled, showLabel){
  const current = value || BAND_COLORS[0];
  const wheelId = `wheel-band-${instId}-${setIdx}`;
  return `
    <div class="wheel-field">
      <div class="wheel-label ${showLabel?'':'wheel-label-hidden'}">Band</div>
      <div class="wheel-frame">
      <div class="wheel-viewport ${disabled?'wheel-disabled':''}" id="${wheelId}"
           data-inst="${instId}" data-idx="${setIdx}" data-field="band"
           data-options='${JSON.stringify(BAND_COLORS)}'>
        <div class="wheel-track">
          ${BAND_COLORS.map(c=>`<div class="wheel-option" data-value="${c}">${c}</div>`).join('')}
        </div>
      </div>
      <div class="wheel-viewport-mask"></div>
      <div class="wheel-center-line"></div>
      </div>
    </div>
  `;
}

const TIME_OPTIONS_SECONDS = (()=>{
  const opts = [];
  for(let s=0; s<=600; s+=30) opts.push(s);       // 0:00 - 10:00 in 30s steps
  for(let m=11; m<=60; m++) opts.push(m*60);       // 11:00 - 60:00 in 1min steps
  return opts;
})();
function formatTimeValue(totalSeconds){
  if(totalSeconds===null || totalSeconds===undefined) totalSeconds = 0;
  const m = Math.floor(totalSeconds/60);
  const s = totalSeconds%60;
  return `${m}:${String(s).padStart(2,'0')}`;
}
function renderTimeWheel(instId, setIdx, value, disabled, showLabel){
  const current = (value===null || value===undefined) ? 0 : value;
  const wheelId = `wheel-time-${instId}-${setIdx}`;
  return `
    <div class="wheel-field">
      <div class="wheel-label ${showLabel?'':'wheel-label-hidden'}">Time</div>
      <div class="wheel-frame">
      <div class="wheel-viewport ${disabled?'wheel-disabled':''}" id="${wheelId}"
           data-inst="${instId}" data-idx="${setIdx}" data-field="time"
           data-options='${JSON.stringify(TIME_OPTIONS_SECONDS)}'>
        <div class="wheel-track">
          ${TIME_OPTIONS_SECONDS.map(v=>`<div class="wheel-option" data-value="${v}">${formatTimeValue(v)}</div>`).join('')}
        </div>
      </div>
      <div class="wheel-viewport-mask"></div>
      <div class="wheel-center-line"></div>
      </div>
    </div>
  `;
}

function initWheels(){
  document.querySelectorAll('.wheel-viewport').forEach(el=>{
    const options = JSON.parse(el.dataset.options);
    const instId = el.dataset.inst;
    const idx = Number(el.dataset.idx);
    const field = el.dataset.field;
    const {inst} = findInstAndBucket(instId) || {};
    if(!inst) return;

    let current;
    if(field==='band') current = inst.sets[idx].band || options[0];
    else current = inst.sets[idx][field] ?? options[0];

    let selIdx = options.findIndex(o=> o===current);
    if(selIdx===-1) selIdx = 0;

    // Scroll to the selected option without animation on initial render.
    // Suppress the resulting native 'scroll' event from being treated as a user edit.
    let suppressNextCommit = true;
    // Only a real finger/mouse/tap interaction may change saved data. Any scroll that
    // the system causes (iOS resetting offsets after backgrounding, relayout) is
    // treated as a display glitch and snapped back to the saved value instead.
    let userActive = false;
    // While a finger is on the wheel nothing is saved or snapped, however long the drag or however
    // often it pauses; the value is settled once the finger lifts and any momentum stops.
    let touching = false;
    let userOffTimer = null;
    const markUser = ()=>{ userActive = true; clearTimeout(userOffTimer); };
    const userOffIn = ms=>{ clearTimeout(userOffTimer); userOffTimer = setTimeout(()=>{ userActive = false; }, ms); };
    el.addEventListener('touchstart', ()=>{ touching = true; markUser(); }, {passive:true});
    el.addEventListener('pointerdown', markUser, {passive:true});
    el.addEventListener('mousedown', markUser, {passive:true});
    el.addEventListener('wheel', markUser, {passive:true});
    const endTouch = ()=>{
      touching = false;
      userOffIn(2500);
      clearTimeout(scrollTimeout); scrollTimeout = setTimeout(settle, 120); // settle even if the finger lifted without momentum
    };
    el.addEventListener('touchend', endTouch, {passive:true});
    el.addEventListener('touchcancel', endTouch, {passive:true});
    el.scrollTop = selIdx * WHEEL_OPTION_HEIGHT;
    updateWheelCenterStyle(el);
    // The scrollTop assignment fires 'scroll' asynchronously on some browsers; clear
    // the suppression shortly after so genuine user scrolls afterward behave normally.
    setTimeout(()=>{ suppressNextCommit = false; }, 150);

    let scrollTimeout = null;
    let lastSnappedIdx = selIdx;
    const settle = ()=>{
        if(suppressNextCommit) return; // programmatic initial-position scroll, not a user edit
        if(touching) return; // finger still down (a pause mid-drag): wait for touchend
        if(!userActive){
          // System-driven scroll: restore the wheel to what is actually saved.
          const cur = findInstAndBucket(instId);
          const si = cur && cur.inst && cur.inst.sets[idx];
          if(si){
            const v = field==='band' ? (si.band || options[0]) : (si[field] ?? options[0]);
            let k = options.findIndex(o=>o===v); if(k===-1) k = 0;
            if(Math.abs(el.scrollTop - k*WHEEL_OPTION_HEIGHT) > 1) el.scrollTop = k*WHEEL_OPTION_HEIGHT;
            lastSnappedIdx = k;
          }
          return;
        }
        const idxNow = Math.round(el.scrollTop / WHEEL_OPTION_HEIGHT);
        const clamped = Math.max(0, Math.min(options.length-1, idxNow));
        el.scrollTo({top: clamped*WHEEL_OPTION_HEIGHT, behavior:'smooth'});
        if(clamped !== lastSnappedIdx){
          lastSnappedIdx = clamped;
          triggerHaptic();
        }
        commitWheelValue(instId, idx, field, options[clamped]);
        // Gesture finished (momentum settled); require a fresh touch for the next change.
        userOffIn(400);
    };
    el.addEventListener('scroll', ()=>{
      updateWheelCenterStyle(el);
      clearTimeout(scrollTimeout);
      scrollTimeout = setTimeout(settle, 90);
    }, {passive:true});

    // Tap any visible option to jump straight to it, instead of needing a precise
    // small scroll gesture. Reuses the same scroll-settle path above, so the commit,
    // haptic, and collapse-on-edit behavior all stay consistent with scrolling.
    el.querySelectorAll('.wheel-option').forEach((optEl, optIdx)=>{
      optEl.addEventListener('click', ()=>{
        if(el.classList.contains('wheel-disabled')) return;
        markUser();
        el.scrollTo({top: optIdx*WHEEL_OPTION_HEIGHT, behavior:'smooth'});
      });
    });
  });
}

function updateWheelCenterStyle(el){
  const centerIdx = Math.round(el.scrollTop / WHEEL_OPTION_HEIGHT);
  const opts = el.querySelectorAll('.wheel-option');
  opts.forEach((opt,i)=>{
    opt.classList.toggle('wheel-center', i===centerIdx);
  });
}

function triggerHaptic(){
  // Vibration API has no effect on iOS Safari (unsupported), but works on Android Chrome.
  if(navigator.vibrate) navigator.vibrate(8);
}

let lastEditedInstId = null;
function commitWheelValue(instId, idx, field, value){
  const {inst} = findInstAndBucket(instId);
  if(!inst) return;
  if(field==='band') inst.sets[idx].band = value;
  else inst.sets[idx][field] = value;
  saveDB();

  // Collapse every other exercise once, the moment editing starts on a *different*
  // exercise than last time — not on every scroll tick, and never re-render the
  // wheel currently mid-gesture (that would reset its scroll position).
  if(lastEditedInstId !== instId){
    lastEditedInstId = instId;
    const hadOthersOpen = [...collapsedExercises].length >= 0 && (()=>{
      const w = getWorkout();
      if(!w) return false;
      return [...w.warmup, ...w.main].some(i=> i.id!==instId && !collapsedExercises.has(i.id));
    })();
    if(hadOthersOpen){
      collapseAllExcept(instId);
      renderWorkout();
    }
  }
}

/* ---------------- Exercise card interactions ---------------- */
function toggleExerciseDetail(instId){
  const cur = openExerciseDetail[instId] || {open:false, tab:'cues'};
  openExerciseDetail[instId] = { ...cur, open: !cur.open };
  renderWorkout();
}
function setDetailTab(instId, tab){
  const cur = openExerciseDetail[instId] || {};
  openExerciseDetail[instId] = { ...cur, open:true, tab };
  renderWorkout();
}

// After a card expands, scroll just enough that its bottom isn't cut off by the bottom of the screen.
// If the card is taller than the space below the sticky header, line its top up under the header instead.
function scrollCardIntoView(instId){
  requestAnimationFrame(()=>{
    const card = document.querySelector(`.exercise-card[data-inst-id="${instId}"]`);
    if(!card) return;
    let sc = card.parentElement;
    while(sc && sc!==document.body && !(sc.scrollHeight > sc.clientHeight && /auto|scroll/.test(getComputedStyle(sc).overflowY))) sc = sc.parentElement;
    if(!sc || (sc===document.body && document.body.scrollHeight <= document.body.clientHeight)) sc = document.scrollingElement;
    const header = document.querySelector('header');
    const topLimit = (header ? header.getBoundingClientRect().bottom : 0) + 8;
    const bottomLimit = (window.visualViewport ? window.visualViewport.height : window.innerHeight) - 12;
    const r = card.getBoundingClientRect();
    let delta = 0;
    if(r.bottom > bottomLimit) delta = r.bottom - bottomLimit;          // reveal the bottom
    if(r.top - delta < topLimit) delta = r.top - topLimit;              // but never push the top under the header
    if(Math.abs(delta) > 1) sc.scrollBy({top: delta, behavior:'smooth'});
  });
}
function toggleCollapse(instId){
  // One expanded card at a time: opening a card collapses the rest; tapping the open card collapses it.
  const opening = collapsedExercises.has(instId);
  if(opening) collapseAllExcept(instId);
  else { collapsedExercises.add(instId); applyPendingMoves(null); }
  renderWorkout();
  if(opening) scrollCardIntoView(instId);
}
function collapseAllExcept(instId){
  const w = getWorkout();
  if(!w) return;
  [...w.warmup, ...w.main].forEach(inst=>{
    if(inst.id !== instId) collapsedExercises.add(inst.id);
  });
  collapsedExercises.delete(instId);
  applyPendingMoves(instId);
}
function changeSecondaryType(instId, newType){
  const {inst} = findInstAndBucket(instId);
  if(!inst) return;
  inst.secondaryType = newType;
  saveDB();
  renderWorkout();
}

function findInstAndBucket(instId){
  const w = getWorkout();
  for(const key of ['warmup','main']){
    const inst = w[key].find(i=>i.id===instId);
    if(inst) return {inst, bucket:w[key], key};
  }
  return null;
}

function updateSet(instId, idx, field, value){
  const {inst} = findInstAndBucket(instId);
  inst.sets[idx][field] = value===''? null : Number(value);
  saveDB();
}
function addSet(instId){
  const {inst} = findInstAndBucket(instId);
  const last = inst.sets[inst.sets.length-1];
  inst.sets.push({ reps: last?last.reps:null, weight: last?last.weight:null, band: last?last.band:null, time: last?last.time:null, done:false });
  saveDB();
  renderWorkout();
}
const isStarted = inst => (inst.sets||[]).some(s=> s.done!==false);
// When an exercise gets its first checked set, move it up within its section to just above the first exercise
// that hasn't been started, so started exercises sit together at the top. Never moves an exercise down.
// The move waits until you're done with the exercise: it happens when that card is collapsed, another exercise
// is opened or edited, an exercise is added, or the workout is closed (applyPendingMoves). In memory only.
let pendingMoveUp = new Set();
function applyPendingMoves(keepId){
  const w = getWorkout();
  if(!w){ pendingMoveUp.clear(); return; }
  let moved = false;
  [...pendingMoveUp].forEach(id=>{
    if(id===keepId) return; // still being worked on
    pendingMoveUp.delete(id);
    for(const key of ['warmup','main']){
      const inst = w[key].find(i=> i.id===id);
      if(inst && isStarted(inst)){ const before = w[key].indexOf(inst); moveUpIfNewlyStarted(w[key], inst); moved = moved || w[key].indexOf(inst)!==before; }
    }
  });
  if(moved) saveDB();
}
function moveUpIfNewlyStarted(bucket, inst){
  const from = bucket.indexOf(inst);
  const to = bucket.findIndex((o, i)=> i < from && !isStarted(o));
  if(from < 0 || to < 0) return;
  bucket.splice(from, 1);
  bucket.splice(to, 0, inst);
}
function toggleSetDone(instId, idx){
  const {inst, bucket} = findInstAndBucket(instId);
  const x = inst && inst.sets[idx];
  if(!x) return;
  const turningOn = (x.done===false);
  const wasStarted = isStarted(inst);
  x.done = turningOn;
  if(turningOn){
    // Checking an untouched set fills it from last session's matching set (or the set above).
    const empty = x.reps==null && x.weight==null && x.band==null && x.time==null;
    if(empty){
      const ls = findLastSession(inst.exerciseId, currentWorkoutId);
      let src = null;
      if(ls){ const arr = ls.inst.sets.filter(y=>y.done!==false); src = arr[idx] || arr[arr.length-1]; }
      if(!src && idx>0) src = inst.sets[idx-1];
      if(src){ x.reps = src.reps ?? null; x.weight = src.weight ?? null; x.band = src.band ?? null; x.time = src.time ?? null; }
    }
    // A band set whose wheel was never moved has no band saved, though the wheel shows the first colour;
    // checking it records what was on screen.
    if((inst.secondaryType||'weight')==='band' && !x.band) x.band = BAND_COLORS[0];
    if(!wasStarted) pendingMoveUp.add(inst.id); // moved up later, once you leave this exercise
  }
  saveDB();
  if(turningOn){
    const w = getWorkout();
    const prs = w ? computePRsForInstance(inst, w) : {};
    if(prs[idx]) showToast('New PR: ' + prs[idx].join(', '));
  }
  renderWorkout();
}
function toggleWarmSet(instId, idx){
  const {inst} = findInstAndBucket(instId);
  const s = inst.sets[idx];
  if(!s) return;
  if(s.warm) delete s.warm; else s.warm = true;
  saveDB();
  renderWorkout();
}
function removeSet(instId){
  const {inst} = findInstAndBucket(instId);
  inst.sets.pop();
  saveDB();
  renderWorkout();
}

function removeExerciseFromWorkout(bucketKey, instId){
  const w = getWorkout();
  w[bucketKey] = w[bucketKey].filter(i=>i.id!==instId);
  saveDB();
  renderWorkout();
}

function renderPickerList(query){
  const listEl = document.getElementById('pickerListScroll');
  const q = query.trim().toLowerCase();
  const tagHitsById = new Map(); // exercise id -> tags that matched (display only; never saved)

  let matches;
  const warmupBucket = window.currentPickerBucket==='warmup';
  if(q===''){
    // No search yet: show the list for this section, alphabetical. Warm-up shows
    // exercises tagged warmup or mobility; the main section shows everything else.
    // Searching always covers the whole library.
    matches = db.exercises
      .filter(e=> showsInPickerList(e.name, warmupBucket))
      .sort((a,b)=> a.name.localeCompare(b.name));
  } else {
    const terms = searchTerms(q);
    matches = db.exercises
      .map(e=>{
        const name = e.name.toLowerCase();
        if(!pickerSearchMatch(e.name, terms, warmupBucket)) return null;
        let score = 3;
        if(name === q) score = 0;
        else if(name.startsWith(q)) score = 1;
        else if(new RegExp('\\b'+escapeRegex(q)).test(name)) score = 2;
        else if(!terms.every(t=> wordsStartWith(searchWords(e.name), t))) score = 4; // found via tags: list after name matches
        const tagHits = score===4 ? matchingTags(e.name, terms) : [];
        return { e, score, tagHits };
      })
      .filter(Boolean)
      .sort((a,b)=> a.score - b.score || a.e.name.localeCompare(b.e.name))
      .map(x=>{ tagHitsById.set(x.e.id, x.tagHits); return x.e; });
  }

  const exactNameExists = q!=='' && db.exercises.some(e=> e.name.toLowerCase()===q);

  let html = '';
  if(matches.length===0){
    html += `<div class="autocomplete-empty">No matches for "${escapeHtml(query.trim())}"</div>`;
  } else {
    html += matches.map(e=>{
      const selected = window.pickerMultiSelect && window.pickerSelectedIds.has(e.id);
      const checkbox = window.pickerMultiSelect
        ? `<span class="picker-checkbox ${selected?'checked':''}">${selected?'✓':''}</span>`
        : '';
      return `
        <div class="picker-item ${selected?'selected':''}" data-ex-id="${e.id}">
          <div class="picker-item-left">
            ${checkbox}
            <span class="picker-icon">${getExerciseIcon(e.name)}</span>
            <span class="pname">${escapeHtml(e.name)}${(tagHitsById.get(e.id)||[]).length ? `<span class="ptags">${escapeHtml(tagHitsById.get(e.id).join(', '))}</span>` : ''}</span>
          </div>
        </div>
      `;
    }).join('');
  }
  if(q!=='' && !exactNameExists && !window.pickerMultiSelect){
    html += `<div class="autocomplete-add-new" onclick="createAndAddExercise('${window.currentPickerBucket}')">+ Add "${escapeHtml(query.trim())}" as a new exercise</div>`;
  }

  if(q===''){
    html += `<div class="autocomplete-empty">${warmupBucket ? 'Showing warm-up and mobility exercises.' : 'Warm-up and mobility exercises are hidden.'} Search to find any exercise.</div>`;
  }
  listEl.innerHTML = html;
  if(listEl.dataset.q !== q){ listEl.scrollTop = 0; listEl.dataset.q = q; } // new search: results start right under the search box (not on multi-select re-renders)
  wireUpPickerItemGestures();
}

function wireUpPickerItemGestures(){
  const listEl = document.getElementById('pickerListScroll');
  if(!listEl) return;
  listEl.querySelectorAll('.picker-item').forEach(itemEl=>{
    const exId = itemEl.dataset.exId;
    let pressTimer = null;
    let longPressFired = false;
    let movedPastThreshold = false;
    let startX = 0, startY = 0;
    const SCROLL_THRESHOLD = 10; // px of finger drift before we treat this as a scroll, not a tap

    const clearTimer = ()=>{ if(pressTimer){ clearTimeout(pressTimer); pressTimer = null; } };

    itemEl.addEventListener('touchstart', (e)=>{
      longPressFired = false;
      movedPastThreshold = false;
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
      pressTimer = setTimeout(()=>{
        longPressFired = true;
        if(navigator.vibrate) navigator.vibrate(10);
        if(window.pickerMultiSelect) toggleItemSelection(exId);
        else enterMultiSelect(exId);
      }, 480);
    }, {passive:true});

    itemEl.addEventListener('touchmove', (e)=>{
      const dx = Math.abs(e.touches[0].clientX - startX);
      const dy = Math.abs(e.touches[0].clientY - startY);
      if(dx > SCROLL_THRESHOLD || dy > SCROLL_THRESHOLD){
        movedPastThreshold = true;
        clearTimer(); // moved too much, treat as scroll not a hold
      }
    }, {passive:true});

    itemEl.addEventListener('touchend', (e)=>{
      clearTimer();
      if(longPressFired) return; // long-press already handled the tap
      if(movedPastThreshold) return; // this was a scroll, not a tap — don't toggle/select
      if(window.pickerSuppressNextToggle){
        window.pickerSuppressNextToggle = false;
        return; // this is the tail-end of the gesture that just triggered enterMultiSelect via re-render
      }
      // Stop the browser's follow-up click: once the sheet closes it would land on whatever card is now under
      // the finger (often the exercise just added) and collapse it.
      if(e.cancelable) e.preventDefault();
      if(window.pickerMultiSelect) toggleItemSelection(exId);
      else selectExerciseFromDropdown(exId);
    });

    // Mouse fallback (desktop testing / non-touch)
    itemEl.addEventListener('mousedown', ()=>{
      longPressFired = false;
      movedPastThreshold = false;
      pressTimer = setTimeout(()=>{
        longPressFired = true;
        if(window.pickerMultiSelect) toggleItemSelection(exId);
        else enterMultiSelect(exId);
      }, 480);
    });
    itemEl.addEventListener('mouseup', ()=>{
      clearTimer();
      if(longPressFired) return;
      if(movedPastThreshold) return;
      if(window.pickerSuppressNextToggle){
        window.pickerSuppressNextToggle = false;
        return;
      }
      if(window.pickerMultiSelect) toggleItemSelection(exId);
      else selectExerciseFromDropdown(exId);
    });
    itemEl.addEventListener('mouseleave', clearTimer);
  });
}

function selectExerciseFromDropdown(exId){
  addExerciseToWorkout(exId);
}

function escapeRegex(str){
  return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}
function addExerciseToWorkout(exId){
  const bucketKey = window.currentPickerBucket;
  const w = getWorkout();
  const def = getExerciseDef(exId);
  addInstanceToWorkout(w, bucketKey, def);
  document.querySelector('.sheet-overlay')?.remove();
  renderWorkout();
}
function createAndAddExercise(bucketKey){
  const nameInput = document.getElementById('pickerSearch');
  const name = nameInput.value.trim();
  if(!name) return;
  const def = ensureExerciseDef(name);
  const w = getWorkout();
  addInstanceToWorkout(w, bucketKey, def);
  document.querySelector('.sheet-overlay')?.remove();
  saveDB();
  renderWorkout();
}
function addInstanceToWorkout(w, bucketKey, def){
  if(bucketKey==='circuit'){ ensureCircuit(w).exercises.push(def.id); saveDB(); return; } // a Circuit workout's circuit holds exercise ids only
  const last = findLastInstance(def.id, w.id);
  const secondaryType = last?.secondaryType || 'weight';
  const prevSets = prefilledSetsFrom(last); // last time's sets and numbers, unchecked
  const inst = { id: uid(), exerciseId: def.id, secondaryType, sets: prevSets };
  w[bucketKey].push(inst);
  // Newly added exercise opens expanded; collapse every other exercise in this workout.
  collapseAllExcept(inst.id);
  scrollToAfterRender = inst.id; // once drawn, bring it into view like any expanded card
  saveDB();
}
function deleteExerciseDef(exId, evt){
  evt.stopPropagation();
  const def = getExerciseDef(exId);
  if(!def) return;
  const overlay = document.createElement('div');
  overlay.className = 'sheet-overlay';
  overlay.innerHTML = `
    <div class="sheet">
      <h2>Delete "${escapeHtml(def.name)}"?</h2>
      <p style="color:var(--muted); font-size:14px; margin:-6px 0 18px;">Its saved cues, videos, and notes will be lost. This cannot be undone.</p>
      <button class="btn-primary" style="background:var(--danger);" id="confirmDeleteExerciseBtn">Delete exercise</button>

function ctPlayTestTone(){
  const ctx = ctAudio.ensureContext();
  const now = ctx.currentTime;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = 'sine';
  osc.frequency.setValueAtTime(523.25, now);
  gain.gain.setValueAtTime(0, now);
  gain.gain.linearRampToValueAtTime(0.5, now + 0.02);
  gain.gain.linearRampToValueAtTime(0, now + 0.4);
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start(now);
  osc.stop(now + 0.45);
}

/* ---- Wake lock ---- */
async function ctRequestWakeLock(){
  if(!('wakeLock' in navigator)) return;
  try{
    ctWakeLockRef = await navigator.wakeLock.request('screen');
    ctWakeLockRef.addEventListener('release', ()=>{ ctWakeLockRef = null; });
  }catch(e){
    console.warn('Wake lock request failed:', e.message);
  }
}
function ctReleaseWakeLock(){
  if(ctWakeLockRef){ ctWakeLockRef.release(); ctWakeLockRef = null; }
}

let ctRecoveryInProgress = false;

document.addEventListener('visibilitychange', ()=>{
  // Re-sync wheel positions from saved data after returning from other apps.
  if(document.visibilityState==='visible' && currentWorkoutId && !document.getElementById('workoutScreen').classList.contains('hidden') && !document.querySelector('.sheet-overlay')){
    try{ renderWorkout(); }catch(e){}
  }
});
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState === 'visible' && ctSession && !ctSession.paused){
    ctRequestWakeLock();
    ctHandleReturnFromBackground();
  }
});

async function ctHandleReturnFromBackground(){
  // Guard against overlapping calls: iOS can fire visibilitychange multiple
  // times in quick succession (lock screen flicker, Face ID prompts, etc).
  // Without this guard, two concurrent calls could race — one call's
  // cancelAllPending() could wipe out tones the OTHER call had just
  // correctly scheduled, silently dropping tones in later rounds as these
  // races compounded over a long session.
  if(ctRecoveryInProgress) return;
  ctRecoveryInProgress = true;
  try{
    if(!ctSession || ctSession.paused) return;
    const elapsed = ctCurrentElapsed();
    const state = getStateAtTime(ctSession.schedule, elapsed);
    if(state.phase==='end'){ ctShowCompletion(); return; }

    const ctx = ctAudio.ensureContext();
    if(ctx.state === 'suspended') await ctx.resume();
    ctSession.startCtxTime = ctAudio.ctx.currentTime - elapsed;

    ctAudio.cancelAllPending();
    ctSession.schedule.events.forEach(ev=>{
      if(ev.atSecond <= elapsed) return;
      if(ev.type==='round') ctAudio.scheduleCountdown(ctSession.startCtxTime + ev.atSecond, 'round');
      else if(ev.type==='switch') ctAudio.scheduleCountdown(ctSession.startCtxTime + ev.atSecond, 'switch');
      else if(ev.type==='complete') ctAudio.scheduleCompletion(ctSession.startCtxTime + ev.atSecond);
    });
  } finally {
    ctRecoveryInProgress = false;
  }
}

/* ---- Session runtime ---- */
function ctStartSession(){
  if(ctConfig.exercises.length===0) return;
  ctAudio.ensureContext();
  document.getElementById('ctSetupScreen').classList.add('hidden');
  ctRunPreStartCountdown();
}

function ctRunPreStartCountdown(){
  const overlay = document.getElementById('ctPreStartOverlay');
  overlay.classList.remove('hidden');
  const numEl = document.getElementById('ctPreStartNum');
  numEl.textContent = '5';

  const ctx = ctAudio.ctx;
  const startAt = ctx.currentTime + 5;
  ctAudio.scheduleCountdown(startAt, 'round');

  let remaining = 5;
  const interval = setInterval(()=>{
    remaining -= 1;
    if(remaining <= 0){
      clearInterval(interval);
      overlay.classList.add('hidden');
      ctBeginSessionNow(startAt);
    } else {
      numEl.textContent = remaining;
    }
  }, 1000);
}

function ctBeginSessionNow(startCtxTime){
  const schedule = buildSchedule({
    rounds: ctConfig.rounds, workSeconds: ctConfig.workSeconds,
    restSeconds: ctConfig.restSeconds, exerciseCount: ctConfig.exercises.length
  });
  schedule.events.forEach(ev=>{
    if(ev.type==='round') ctAudio.scheduleCountdown(startCtxTime + ev.atSecond, 'round');
    else if(ev.type==='switch') ctAudio.scheduleCountdown(startCtxTime + ev.atSecond, 'switch');
    else if(ev.type==='complete') ctAudio.scheduleCompletion(startCtxTime + ev.atSecond);
  });
  ctSession = { schedule, startCtxTime, startWallTime: Date.now(), paused:false, pausedAtElapsed:0 };
  document.getElementById('ctRunningScreen').classList.remove('hidden');
  ctBuildProgressDots(schedule);
  ctRequestWakeLock();
  ctRunTick();
}

function ctBuildProgressDots(schedule){
  const wrap = document.getElementById('ctSessionProgress');
  const roundEvents = schedule.events.filter(e=> e.type==='round');
  wrap.innerHTML = roundEvents.map(e=>`<div class="seg" data-phase="${e.phase}" data-at="${e.atSecond}"></div>`).join('');
}

function ctCurrentElapsed(){
  if(!ctSession) return 0;
  if(ctSession.paused) return ctSession.pausedAtElapsed;
  return (Date.now() - ctSession.startWallTime) / 1000;
}

function ctRunTick(){
  if(!ctSession) return;
  const elapsed = Math.max(0, ctCurrentElapsed());
  const state = getStateAtTime(ctSession.schedule, elapsed);
  if(state.phase==='end'){ ctShowCompletion(); return; }
  ctRenderRunningState(state, elapsed);
  ctSession._raf = requestAnimationFrame(ctRunTick);
}

function ctRenderRunningState(state, elapsed){
  const band = document.getElementById('ctRunPhaseBand');
  band.className = 'ct-run-phase-band ' + state.phase;
  document.getElementById('ctRunPhaseLabel').textContent = state.phase==='work' ? 'WORK' : 'REST';

  const roundEvents = ctSession.schedule.events.filter(e=>e.type==='round');
  const idx = roundEvents.filter(e=> e.atSecond <= elapsed).length;
  const roundNum = Math.min(ctConfig.rounds, Math.ceil(idx/2) || 1);
  document.getElementById('ctRunRoundLabel').textContent = `Round ${roundNum} of ${ctConfig.rounds}`;

  const next = state.nextEvent;
  const remaining = next ? Math.max(0, next.atSecond - elapsed) : 0;
  document.getElementById('ctCountdownTime').textContent = ctFmtMinSec(Math.ceil(remaining));
  document.getElementById('ctCountdownSub').textContent =
    next ? (next.type==='switch' ? 'until next exercise' : (next.phase==='rest' ? 'until rest' : (next.phase==='work' ? 'until work' : 'until done'))) : '';

  const lastAt = state.currentRoundEvent ? state.currentRoundEvent.atSecond : 0;
  const nextAt = next ? next.atSecond : lastAt;
  const span = Math.max(1, nextAt - lastAt);
  const progressFrac = Math.min(1, (elapsed - lastAt) / span);
  const circumference = 276.5;
  const ringFg = document.getElementById('ctRingFg');
  ringFg.setAttribute('stroke-dashoffset', circumference * progressFrac);
  ringFg.setAttribute('stroke', state.phase==='work' ? '#5a6b52' : '#a35d3a');

  const ringWrap = document.querySelector('.ct-countdown-ring-wrap');
  if(remaining <= 5 && remaining > 0) ringWrap.classList.add('ct-imminent-flash');
  else ringWrap.classList.remove('ct-imminent-flash');

  const exDisplay = document.getElementById('ctExerciseDisplay');
  if(state.phase==='work'){
    exDisplay.style.opacity = '1';
    const exId = ctConfig.exercises[state.exerciseIndex];
    const def = exId ? getExerciseDef(exId) : null;
    const name = def ? def.name : '—';
    document.getElementById('ctExerciseDisplayIcon').innerHTML = getExerciseIcon(name);
    document.getElementById('ctExerciseDisplayName').textContent = name;
    document.getElementById('ctExerciseDisplayPosition').textContent =
      ctConfig.exercises.length>1 ? `Exercise ${state.exerciseIndex+1} of ${ctConfig.exercises.length}` : '';
  } else {
    exDisplay.style.opacity = '0.4';
    document.getElementById('ctExerciseDisplayName').textContent = 'Zone 2 / Rest';
    document.getElementById('ctExerciseDisplayPosition').textContent = '';
    document.getElementById('ctExerciseDisplayIcon').innerHTML = '';
  }

  document.querySelectorAll('#ctSessionProgress .seg').forEach(seg=>{
    const at = Number(seg.dataset.at);
    seg.classList.toggle('done', at < lastAt || (at===lastAt && elapsed>lastAt));
    seg.classList.toggle('current', at===lastAt);
  });
}

function ctTogglePause(){
  if(!ctSession) return;
  const btn = document.getElementById('ctPauseBtn');
  if(ctSession.paused){
    ctResumeSession();
  } else {
    ctSession.pausedAtElapsed = ctCurrentElapsed();
    ctSession.paused = true;
    btn.textContent = 'Resume';
    if(ctSession._raf) cancelAnimationFrame(ctSession._raf);
    ctAudio.cancelAllPending();
    ctReleaseWakeLock();
  }
}

async function ctResumeSession(){
  const btn = document.getElementById('ctPauseBtn');
  const ctx = ctAudio.ensureContext();
  if(ctx.state === 'suspended') await ctx.resume();

  const elapsed = ctSession.pausedAtElapsed;
  ctSession.startWallTime = Date.now() - elapsed*1000;
  ctSession.startCtxTime = ctAudio.ctx.currentTime - elapsed;
  ctSession.paused = false;
  btn.textContent = 'Pause';

  ctSession.schedule.events.forEach(ev=>{
    if(ev.atSecond <= elapsed) return;
    if(ev.type==='round') ctAudio.scheduleCountdown(ctSession.startCtxTime + ev.atSecond, 'round');
    else if(ev.type==='switch') ctAudio.scheduleCountdown(ctSession.startCtxTime + ev.atSecond, 'switch');
    else if(ev.type==='complete') ctAudio.scheduleCompletion(ctSession.startCtxTime + ev.atSecond);
  });

  ctRequestWakeLock();
  ctRunTick();
}

function ctEndSessionConfirm(){
  if(confirm('End this circuit early?')){
    if(ctSession && ctSession._raf) cancelAnimationFrame(ctSession._raf);
    ctAudio.cancelAllPending();
    ctReleaseWakeLock();
    ctSession = null;
    document.getElementById('ctRunningScreen').classList.add('hidden');
    document.getElementById('circuitTimerOverlay').classList.add('hidden');
  }
}

function ctShowCompletion(){
  document.getElementById('ctRunningScreen').classList.add('hidden');
  document.getElementById('ctCompletionOverlay').classList.remove('hidden');
  const totalMin = Math.round(ctSession.schedule.totalSeconds/60);
  document.getElementById('ctCompletionSummary').textContent =
    `${ctConfig.rounds} rounds · ${ctConfig.exercises.length} exercises · ${totalMin} min total`;
  ctReleaseWakeLock();
  ctSession = null;
}

/* ---------------- Sync (private GitHub repo) ----------------
   Settings (this device only): localStorage 'workoutLogSync_v1' = {repo:'owner/name', token, path, lastSync}.
   Sync = download the data file, merge it with this device, save locally, upload the result (retrying if another
   device uploaded in between). Merge: per workout/exercise the newest updatedAt wins; deletions win over older
   edits; exercises with the same name but different ids (each device created its own built-ins) are joined under
   the smaller id and workouts repointed. A backup of this device's data is kept before each sync. */
const SYNC_KEY = 'workoutLogSync_v1';
function syncSettings(){ try { return JSON.parse(localStorage.getItem(SYNC_KEY) || 'null'); } catch(e){ return null; } }
function saveSyncSettings(o){ try { localStorage.setItem(SYNC_KEY, JSON.stringify(o)); } catch(e){} }
function b64encodeUtf8(str){ const bytes = new TextEncoder().encode(str); let bin = ''; for(let i=0;i<bytes.length;i+=0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i+0x8000)); return btoa(bin); }
function b64decodeUtf8(b64){ const bin = atob(b64.replace(/\s/g,'')); const bytes = new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i); return new TextDecoder().decode(bytes); }
function ghUrl(st){ return `https://api.github.com/repos/${st.repo}/contents/${encodeURIComponent(st.path||'workout-data.json')}`; }
function ghHeaders(st, accept){ return { 'Authorization':'Bearer '+st.token, 'Accept': accept || 'application/vnd.github+json', 'X-GitHub-Api-Version':'2022-11-28' }; }
async function ghGet(st){
  const res = await fetch(ghUrl(st) + '?t=' + Date.now(), { headers: ghHeaders(st), cache:'no-store' });
  if(res.status===404) return { data:null, sha:null };
  if(!res.ok) throw new Error(res.status===401 ? 'GitHub rejected the token (401).' : res.status===403 ? 'The token can\'t read that repo (403).' : 'GitHub error '+res.status+' reading the data file.');
  const j = await res.json();
  let text = j.content ? b64decodeUtf8(j.content) : '';
  if(!text && j.download_url!==undefined){ // files over 1 MB come without inline content
    const raw = await fetch(ghUrl(st) + '?t=' + Date.now(), { headers: ghHeaders(st, 'application/vnd.github.raw'), cache:'no-store' });
    if(!raw.ok) throw new Error('GitHub error '+raw.status+' reading the data file.');
    text = await raw.text();
  }
  return { data: text ? JSON.parse(text) : null, sha: j.sha };
}
async function ghPut(st, data, sha){
  const body = { message: 'Sync from ' + (navigator.platform || 'device') + ' ' + new Date().toISOString().slice(0,16), content: b64encodeUtf8(JSON.stringify(data)) };
  if(sha) body.sha = sha;
  const res = await fetch(ghUrl(st), { method:'PUT', headers: { ...ghHeaders(st), 'Content-Type':'application/json' }, body: JSON.stringify(body) });
  if(res.status===409 || res.status===422) return false; // someone else uploaded first
  if(!res.ok) throw new Error(res.status===403 || res.status===404 ? 'The token can\'t write to that repo ('+res.status+').' : 'GitHub error '+res.status+' saving the data file.');
  return true;
}
function mergeDBs(local, remote){
  if(!remote) return JSON.parse(JSON.stringify(local));
  const L = JSON.parse(JSON.stringify(local)), R = JSON.parse(JSON.stringify(remote));
  const deleted = { workouts:{}, exercises:{} };
  [L.deleted, R.deleted].forEach(d=> d && ['workouts','exercises'].forEach(k=> Object.entries(d[k]||{}).forEach(([id,t])=>{ deleted[k][id] = Math.max(deleted[k][id]||0, t); })));
  const pick = (a, b)=> !a ? b : !b ? a : ((b.updatedAt||0) > (a.updatedAt||0) ? b : a); // tie keeps this device's
  // exercises: newest per id, then join same-name duplicates under the smaller id
  const exById = new Map();
  [...(L.exercises||[]), ...(R.exercises||[])].forEach(e=> exById.set(e.id, pick(exById.get(e.id), e)));
  const byName = new Map(), remap = {};
  [...exById.values()].sort((a,b)=> a.id < b.id ? -1 : a.id > b.id ? 1 : 0).forEach(e=>{
    const n = (e.name||'').trim().toLowerCase(), keep = byName.get(n);
    if(!keep){ byName.set(n, e); return; }
    remap[e.id] = keep.id;
    if((e.updatedAt||0) > (keep.updatedAt||0)) byName.set(n, { ...e, id: keep.id });
  });
  let exercises = [...byName.values()].filter(e=> !(deleted.exercises[e.id] >= (e.updatedAt||0)));
  // workouts: newest per id; a deletion newer than the last edit removes it
  const wById = new Map();
  [...(L.workouts||[]), ...(R.workouts||[])].forEach(w=> wById.set(w.id, pick(wById.get(w.id), w)));
  const fix = id=> remap[id] || id;
  const workouts = [...wById.values()].filter(w=> !(deleted.workouts[w.id] >= (w.updatedAt||0))).map(w=>{
    ['warmup','main'].forEach(k=> (w[k]||[]).forEach(i=>{ i.exerciseId = fix(i.exerciseId); }));
    if(w.circuit && Array.isArray(w.circuit.exercises)) w.circuit.exercises = w.circuit.exercises.map(fix);
    return w;
  });
  // never drop an exercise a workout still uses
  const used = new Set(); workouts.forEach(w=>{ ['warmup','main'].forEach(k=> (w[k]||[]).forEach(i=> used.add(i.exerciseId))); ((w.circuit||{}).exercises||[]).forEach(id=> used.add(id)); });
  const have = new Set(exercises.map(e=> e.id));
  [...byName.values()].forEach(e=>{ if(used.has(e.id) && !have.has(e.id)) exercises.push(e); });
  return { ...L, workouts, exercises, deleted };
}
let syncing = false;
async function syncNow(){
  const st = syncSettings();
  if(!st || !st.repo || !st.token){ openSyncSettings(); return; }
  if(syncing) return; syncing = true;
  const btn = document.getElementById('syncBtn'); if(btn) btn.classList.add('spinning');
  try {
    if(!navigator.onLine) throw new Error('You\'re offline.');
    try { localStorage.setItem('workoutLogDB_v1_backup_pre_sync', localStorage.getItem(DB_KEY) || ''); } catch(e){ throw new Error('Couldn\'t back up this device\'s data first, so nothing was synced.'); }
    let ok = false, merged = null, before = db.workouts.length;
    for(let attempt=0; attempt<3 && !ok; attempt++){
      stampEdits();
      const { data, sha } = await ghGet(st);
      merged = mergeDBs(db, data);
      ok = await ghPut(st, merged, sha);
    }
    if(!ok) throw new Error('Another device kept syncing at the same moment. Try again.');
    db = merged;
    localStorage.setItem(DB_KEY, JSON.stringify(db));
    takeSyncSnapshot();
    st.lastSync = Date.now(); saveSyncSettings(st);
    const diff = db.workouts.length - before;
    showToast('Synced' + (diff>0 ? ` · ${diff} workout${diff===1?'':'s'} added` : diff<0 ? ` · ${-diff} removed` : ''));
    if(currentWorkoutId && !getWorkout()) showLanding();
    else if(currentWorkoutId) renderWorkout(); else showLanding();
  } catch(e){
    showToast('Sync failed: ' + (e && e.message ? e.message : 'network error'));
  } finally {
    syncing = false; if(btn) btn.classList.remove('spinning');
  }
}
function openSyncSettings(){
  const st = syncSettings() || { repo:'', token:'', path:'workout-data.json' };
  const overlay = document.createElement('div');
  overlay.className = 'sheet-overlay';
  overlay.innerHTML = `<div class="sheet sync-sheet"><h2>Sync</h2>
    <p class="sync-help">Keeps your workouts in one file in a <b>private</b> GitHub repo, so every browser or device you set up here can sync. Settings are saved on this device only.</p>
    <label>Repository<input type="text" id="syncRepo" placeholder="owner/repo" autocomplete="off" autocapitalize="off" spellcheck="false" value="${escapeHtml(st.repo||'')}"></label>
    <label>Access token<input type="password" id="syncToken" placeholder="github_pat_…" autocomplete="off" value="${escapeHtml(st.token||'')}"></label>
    <label>File<input type="text" id="syncPath" autocomplete="off" autocapitalize="off" spellcheck="false" value="${escapeHtml(st.path||'workout-data.json')}"></label>
    ${st.lastSync ? `<p class="sync-help">Last synced ${new Date(st.lastSync).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}</p>` : ''}
    <button class="btn-primary" id="syncSaveBtn">Save and sync</button>
    ${st.token ? '<button class="btn-secondary" id="syncForgetBtn">Turn off sync on this device</button>' : ''}
    <button class="btn-secondary" onclick="this.closest('.sheet-overlay').remove()">Cancel</button></div>`;
  document.getElementById('modalRoot').appendChild(overlay);
  overlay.addEventListener('click', e=>{ if(e.target===overlay) overlay.remove(); });
  overlay.querySelector('#syncSaveBtn').onclick = ()=>{
    const repo = overlay.querySelector('#syncRepo').value.trim().replace(/^https?:\/\/github\.com\//,'').replace(/\.git$/,'').replace(/\/$/,'');
    const token = overlay.querySelector('#syncToken').value.trim();
    const path = overlay.querySelector('#syncPath').value.trim() || 'workout-data.json';
    if(!/^[\w.-]+\/[\w.-]+$/.test(repo)){ showToast('Repository should look like owner/repo'); return; }
    if(!token){ showToast('Paste your access token'); return; }
    saveSyncSettings({ ...st, repo, token, path });
    overlay.remove(); syncNow();
  };
  const forget = overlay.querySelector('#syncForgetBtn');
  if(forget) forget.onclick = ()=>{ try { localStorage.removeItem(SYNC_KEY); } catch(e){} overlay.remove(); showToast('Sync turned off on this device'); };
}
// Long-press the sync button to change settings.
(function(){
  const btn = document.getElementById('syncBtn'); if(!btn) return;
  let t = null, held = false;
  btn.addEventListener('touchstart', ()=>{ held = false; t = setTimeout(()=>{ held = true; openSyncSettings(); }, 550); }, {passive:true});
  btn.addEventListener('touchend', e=>{ clearTimeout(t); if(held && e.cancelable) e.preventDefault(); });
  btn.addEventListener('touchmove', ()=> clearTimeout(t), {passive:true});
})();

/* ---------------- Update check ----------------
   GitHub Pages lets the phone keep an old copy of this page for ~10 minutes, and a home-screen bookmark has no
   reload button. On launch and whenever the app comes back to the front (at most once a minute), fetch the live
   page bypassing every cache and compare its build label with the one running. If it differs, offer a one-tap
   reload. Offline or any error: do nothing. Saved data is untouched (it lives in localStorage, not the page). */
let lastUpdateCheck = 0;
function runningBuild(){ const el = document.querySelector('.build-label'); return el ? el.textContent.trim() : ''; }
async function checkForUpdate(force, manual){
  if(!force && Date.now() - lastUpdateCheck < 60000) return;
  lastUpdateCheck = Date.now();
  if(!/^https?:/.test(location.protocol)){ if(manual) showToast('Can\'t check for updates here'); return; }
  try {
    const res = await fetch(location.pathname + '?check=' + Date.now(), {cache:'no-store'});
    if(!res.ok){ if(manual) showToast('Couldn\'t check for updates'); return; }
    const m = (await res.text()).match(/<div class="build-label"[^>]*>([^<]*)<\/div>/);
    if(m && m[1].trim() && m[1].trim() !== runningBuild()) showUpdateBar();
    else if(manual) showToast('You\'re on the latest version');
  } catch(e){ if(manual) showToast('Couldn\'t check for updates (offline?)'); }
}
function showUpdateBar(){
  if(document.getElementById('updateBar')) return;
  const bar = document.createElement('div');
  bar.id = 'updateBar';
  bar.className = 'update-bar';
  bar.innerHTML = `<span>New version available</span>
    <button class="update-reload" onclick="location.replace(location.pathname + '?v=' + Date.now())">Reload</button>
    <button class="update-close" aria-label="Dismiss" onclick="this.parentElement.remove()">✕</button>`;
  document.body.appendChild(bar);
}
setTimeout(()=> checkForUpdate(true), 1500);
// Tap the build label to check now. (The label's markup must stay exactly <div class="build-label">…</div>:
// older builds look for it in that form to detect updates.)
document.querySelectorAll('.build-label').forEach(el=> el.addEventListener('click', ()=> checkForUpdate(true, true)));
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') checkForUpdate(false); });
</script>
</body>
</html>
