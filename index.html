<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Workout Log</title>
<meta name="theme-color" content="#3d4a3d">
<style>
  :root{
    --bg:#f4f1ea; --card:#ffffff; --ink:#2c2c28; --muted:#8a8a80;
    --sage:#5a6b52; --sage-dark:#3d4a3d; --rust:#a35d3a; --line:#e5e0d5;
    --danger:#b3492f; --radius:14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  input, textarea{max-width:100%;}
  html,body{height:100%; overflow-x:hidden; max-width:100vw;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding-bottom:90px;
  }
  header{
    position:sticky; top:0; z-index:20; background:var(--sage-dark); color:#fff;
    padding:16px 18px; display:flex; align-items:center; justify-content:space-between;
  }
  header h1{font-size:19px; margin:0; font-weight:600; letter-spacing:.2px;}
  header h1.editable{cursor:pointer; text-decoration:underline dotted; text-underline-offset:4px;}
  header .back{font-size:22px; cursor:pointer; padding:4px 8px; margin-left:-8px;}
  header #editDateIcon{font-size:16px; cursor:pointer; padding:4px 8px; width:24px; text-align:right;}
  .header-actions{display:flex; align-items:center; gap:4px;}
  .header-action-icon{font-size:15px; cursor:pointer; padding:6px 7px; color:#fff; opacity:.9;}
  .header-action-icon.danger{color:#f0b8ab;}
  .screen{padding:14px 14px 20px;}
  .hidden{display:none !important;}


  /* Landing list — swipe to reveal actions */
  .day-card-wrap{
    position:relative; border-radius:var(--radius); margin-bottom:10px; overflow:hidden;
  }
  .day-card-actions{
    position:absolute; top:0; right:0; bottom:0; display:flex; align-items:stretch;
  }
  .day-card-action-btn{
    width:64px; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:2px; border:none; cursor:pointer; font-size:11px; font-weight:600; color:#fff;
  }
  .day-card-action-btn .icon{font-size:17px;}
  .day-card-action-btn.copy-btn{background:var(--sage);}
  .day-card-action-btn.delete-btn{background:var(--danger);}
  .day-card{
    position:relative; background:var(--card); border-radius:var(--radius); padding:14px 16px;
    box-shadow:0 1px 3px rgba(0,0,0,.06); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    touch-action:pan-y; transition:transform .2s ease; will-change:transform;
  }
  .day-card-main{flex:1; min-width:0; cursor:pointer;}
  .day-card .date-line{font-weight:600; font-size:15.5px; color:var(--ink);}
  .day-card .type-line{font-size:13px; color:var(--muted); margin-top:3px;}
  .empty-state{text-align:center; color:var(--muted); padding:60px 20px; font-size:14px; line-height:1.6;}

  .fab{
    position:fixed; bottom:22px; right:20px; width:58px; height:58px; border-radius:50%;
    background:var(--sage); color:#fff; font-size:30px; border:none; box-shadow:0 4px 14px rgba(0,0,0,.25);
    display:flex; align-items:center; justify-content:center; cursor:pointer; z-index:30;
  }

  /* Type select modal */
  .sheet-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:150;
    display:flex; align-items:flex-end;
  }
  .sheet{
    background:var(--bg); width:100%; border-radius:20px 20px 0 0; padding:20px 18px 26px;
    max-height:80vh; overflow-y:auto;
  }
  .sheet h2{margin:0 0 14px; font-size:17px;}

  /* Exercise picker: fixed header (title+search) with independently scrolling list below */
  .picker-sheet{
    background:var(--bg); width:100%; border-radius:20px 20px 0 0;
    max-height:80vh; display:flex; flex-direction:column; overflow:hidden;
  }
  .picker-sheet-header{
    padding:20px 18px 12px; flex-shrink:0; background:var(--bg); border-radius:20px 20px 0 0;
  }
  .picker-sheet-header h2{margin:0 0 14px; font-size:17px;}
  .picker-list-scroll{
    flex:1; overflow-y:auto; padding:0 18px 18px; -webkit-overflow-scrolling:touch;
  }
  .picker-sheet-footer{padding:10px 18px 22px; flex-shrink:0;}
  .type-grid{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px;}
  .type-chip{
    padding:9px 14px; border-radius:20px; border:1.5px solid var(--line); background:#fff;
    font-size:13.5px; cursor:pointer; color:var(--ink); user-select:none;
  }
  .type-chip.selected{background:var(--sage); border-color:var(--sage); color:#fff;}
  .btn-primary{
    width:100%; padding:13px; border-radius:12px; border:none; background:var(--sage);
    color:#fff; font-size:15.5px; font-weight:600; cursor:pointer;
  }
  .btn-primary:disabled{background:#c9c9bd; cursor:not-allowed;}
  .btn-secondary{
    width:100%; padding:12px; border-radius:12px; border:1.5px solid var(--line); background:transparent;
    color:var(--ink); font-size:14.5px; margin-top:8px; cursor:pointer;
  }
  .btn-text{background:none; border:none; color:var(--sage-dark); font-size:14px; cursor:pointer; font-weight:600;}

  /* Workout detail */
  .section-label{
    font-size:12.5px; text-transform:uppercase; letter-spacing:.6px; color:var(--muted);
    font-weight:700; margin:18px 4px 8px;
  }
  .section-toggle{display:flex; align-items:center; gap:6px; cursor:pointer; user-select:none; -webkit-user-select:none; padding:6px 4px; margin:12px 0 4px;}
  .section-toggle .chev{display:inline-block; transition:transform .15s; font-size:11px;}
  .section-toggle.is-collapsed .chev{transform:rotate(-90deg);}
  .section-toggle .sec-count{font-weight:500; text-transform:none; letter-spacing:0; opacity:.8;}
  .set-num.tappable{cursor:pointer; border-radius:6px;}
  .set-num.is-warm{color:var(--sage-dark); font-weight:800;}
  /* check-off, previous, PR */
  .set-row{grid-template-columns:24px 1fr 1fr 36px !important;}
  .set-check{
    width:34px; height:34px; border-radius:50%; border:1.8px solid var(--line); background:#faf9f5; color:#c9c5b8;
    font-size:17px; font-weight:800; cursor:pointer; margin-bottom:21px; padding:0; line-height:1; align-self:end;
  }
  .set-check.on{background:var(--sage); border-color:var(--sage); color:#fff;}
  .set-num.has-pr{color:var(--rust); font-weight:800;}
  .prev-line{padding:0 15px 8px; font-size:12.5px; color:var(--muted); line-height:1.45;}
  .prev-line b{color:var(--sage-dark); font-weight:700;}
  .pr-badge{display:inline-flex; align-items:center; gap:3px; background:#f6e7dd; color:var(--rust); font-size:11px; font-weight:800; padding:2px 7px; border-radius:20px; margin-left:6px; vertical-align:middle;}
  .pr-list{padding:0 15px 8px; display:flex; flex-wrap:wrap; gap:6px;}
  .pr-chip{display:inline-flex; align-items:center; gap:4px; background:#f6e7dd; color:var(--rust); font-size:12px; font-weight:700; padding:4px 9px; border-radius:20px;}
  .e1rm-line{padding:0 15px 10px; font-size:12.5px; color:var(--muted);}
  .e1rm-line b{color:var(--sage-dark);}
  /* history */
  .metric-chips{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px;}
  .metric-chip{padding:5px 10px; border-radius:16px; font-size:12px; font-weight:600; border:1px solid var(--line); background:#fff; color:var(--muted); cursor:pointer;}
  .metric-chip.active{background:var(--sage-dark); color:#fff; border-color:var(--sage-dark);}
  .chart-wrap svg{width:100%; height:auto; display:block;}
  .ch-grid{stroke:var(--line); stroke-width:1;}
  .ch-axis{fill:var(--muted); font-size:9.5px;}
  .ch-line{stroke:var(--sage); stroke-width:2.2; fill:none; stroke-linejoin:round; stroke-linecap:round;}
  .ch-dot{fill:#fff; stroke:var(--sage); stroke-width:2;}
  .ch-dot.pr{fill:var(--rust); stroke:var(--rust);}
  .ch-bar{fill:var(--sage); opacity:.55;}
  .ch-bar.cur{opacity:1;}
  .ch-hit{fill:transparent; cursor:pointer;}
  .chart-readout{font-size:12.5px; color:var(--sage-dark); font-weight:600; min-height:18px; margin:2px 0 8px;}
  .rec-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:6px 0 10px;}
  .rec-card{background:#fff; border:1px solid var(--line); border-radius:10px; padding:8px 10px;}
  .rec-card .k{font-size:10.5px; text-transform:uppercase; letter-spacing:.4px; color:var(--muted); font-weight:700;}
  .rec-card .v{font-size:16px; font-weight:800; color:var(--sage-dark);}
  .rec-card .d{font-size:11px; color:var(--muted);}
  .hist-h{font-size:11.5px; text-transform:uppercase; letter-spacing:.5px; color:var(--muted); font-weight:700; margin:10px 0 6px;}
  .hist-row{background:#fff; border:1px solid var(--line); border-radius:10px; padding:8px 10px; margin-bottom:6px;}
  .hist-row .hd{font-size:12.5px; font-weight:700; color:var(--sage-dark); display:flex; justify-content:space-between; gap:6px;}
  .hist-row .sets{font-size:12.5px; color:var(--ink); margin-top:3px; line-height:1.5;}
  .raw-table{width:100%; font-size:12.5px; border-collapse:collapse;}
  .raw-table td{padding:3px 0; border-bottom:1px solid var(--line);}
  /* stats */
  .stat-cards{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:12px;}
  .stat-card{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px;}
  .stat-card .k{font-size:10.5px; text-transform:uppercase; letter-spacing:.4px; color:var(--muted); font-weight:700;}
  .stat-card .v{font-size:21px; font-weight:800; color:var(--sage-dark); margin-top:2px;}
  .stat-card .d{font-size:11px; color:var(--muted);}
  .stat-panel{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:12px; margin-bottom:12px;}
  .stat-panel h3{margin:0 0 8px; font-size:13px; text-transform:uppercase; letter-spacing:.5px; color:var(--muted);}
  .cal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:6px;}
  .cal-head .t{font-weight:700; font-size:15px;}
  .cal-nav{background:none; border:none; font-size:22px; color:var(--sage-dark); padding:2px 10px; cursor:pointer;}
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px; text-align:center;}
  .cal-dow{font-size:10.5px; color:var(--muted); font-weight:700;}
  .cal-day{aspect-ratio:1/1; display:flex; align-items:center; justify-content:center; font-size:13px; border-radius:50%; background:none; border:none; color:var(--ink); padding:0;}
  .cal-day.has{background:var(--sage); color:#fff; font-weight:700; cursor:pointer;}
  .cal-day.today{box-shadow:inset 0 0 0 2px var(--rust);}
  .exercise-card{
    background:var(--card); border-radius:var(--radius); margin-bottom:10px; border:1px solid var(--line); overflow:hidden;
  }
  .drag-ghost{
    position:fixed; z-index:200; pointer-events:none; box-shadow:0 8px 24px rgba(0,0,0,.25);
    border-radius:var(--radius); opacity:0.95; transform:scale(1.02);
  }
  .drag-source-hidden{ visibility:hidden; }
  .drag-placeholder{
    border-radius:var(--radius); margin-bottom:10px; border:2px dashed var(--sage);
    background:rgba(90,107,82,0.08);
  }
  .exercise-head{
    padding:13px 15px; display:flex; justify-content:space-between; align-items:center; gap:8px;
  }
  .exercise-icon{width:30px; height:30px; flex-shrink:0; color:var(--sage-dark); margin-right:10px;}
  .exercise-icon svg{width:100%; height:100%; display:block;}
  .exercise-head-left{display:flex; align-items:center; min-width:0; flex:1; cursor:pointer;}
  .exercise-head-text{display:flex; flex-direction:column; min-width:0;}
  .exercise-head .name{font-weight:600; font-size:15px;}
  .set-summary{font-size:12.5px; color:var(--muted); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .delta-up{color:#4a7c3f; font-weight:600;}
  .delta-down{color:var(--muted);}
  .delta-steady{color:var(--muted);}
  .exercise-head .chev, .exercise-head .collapse-chev{color:var(--muted); font-size:13px; transition:transform .15s; padding:4px 6px; cursor:pointer; flex-shrink:0;}
  .exercise-head .chev.open, .exercise-head .collapse-chev.open{transform:rotate(180deg);}
  .sets-list{padding:0 15px 12px;}
  .set-row{
    display:grid; grid-template-columns:24px 1fr 1fr; gap:10px; align-items:end; margin-bottom:10px;
  }
  .set-row .set-num{font-size:12.5px; color:var(--muted); text-align:center; padding-bottom:11px;}
  .set-row input:disabled{background:#eee; color:var(--muted);}
  .secondary-type-row{padding:0 15px 10px; display:flex; justify-content:flex-end;}
  .type-select{
    padding:6px 10px; border-radius:8px; border:1px solid var(--line); background:#faf9f5;
    font-size:13px; color:var(--sage-dark); font-weight:600;
  }

  /* Scroll wheel */
  .wheel-field{display:flex; flex-direction:column; align-items:center;}
  .wheel-label{font-size:10.5px; text-transform:uppercase; letter-spacing:.4px; color:var(--muted); font-weight:700; margin-bottom:3px;}
  .wheel-label-hidden{visibility:hidden;}
  .wheel-viewport{
    position:relative; width:100%; height:76px; overflow-y:scroll; scroll-snap-type:y mandatory;
    border-radius:9px; border:1px solid var(--line); background:#faf9f5;
    -webkit-overflow-scrolling:touch;
  }
  .wheel-viewport.wheel-disabled{background:#eee; pointer-events:none;}
  .wheel-viewport::-webkit-scrollbar{display:none;}
  .wheel-track{padding:25px 0;}
  .wheel-option{
    height:26px; scroll-snap-align:center; display:flex; align-items:center; justify-content:center;
    font-size:14px; color:var(--muted); user-select:none; cursor:pointer;
  }
  .wheel-option.wheel-center{font-size:17px; font-weight:700; color:var(--sage-dark);}
  .wheel-viewport-mask{
    position:absolute; left:0; right:0; top:0; height:100%; pointer-events:none;
    background:linear-gradient(to bottom, #faf9f5 0%, transparent 30%, transparent 70%, #faf9f5 100%);
  }
  .wheel-center-line{
    position:absolute; left:4px; right:4px; top:50%; height:26px; transform:translateY(-50%);
    border-top:1.5px solid var(--sage); border-bottom:1.5px solid var(--sage); pointer-events:none; border-radius:5px;
  }
  .add-set-btn, .remove-set-btn{
    background:none; border:none; color:var(--sage-dark); font-size:13px; font-weight:600; cursor:pointer; padding:4px 0;
  }
  .set-actions{display:flex; gap:14px; margin-top:2px;}

  .exercise-detail{
    border-top:1px solid var(--line); padding:12px 15px 14px; background:#faf9f4;
  }
  .detail-tabs{display:flex; gap:6px; margin-bottom:10px;}
  .detail-tab{
    flex:1; text-align:center; padding:7px 4px; font-size:12.5px; border-radius:8px;
    background:#fff; border:1px solid var(--line); cursor:pointer; color:var(--muted); font-weight:600;
  }
  .detail-tab.active{background:var(--sage-dark); color:#fff; border-color:var(--sage-dark);}
  .detail-pane{font-size:13.5px; line-height:1.5;}
  .cue-item{
    background:#fff; border:1px solid var(--line); border-radius:9px; padding:9px 11px; margin-bottom:7px;
    display:flex; justify-content:space-between; align-items:flex-start; gap:8px;
  }
  .cue-item .cue-x{color:var(--muted); cursor:pointer; font-size:15px; line-height:1;}
  .link-item{
    background:#fff; border:1px solid var(--line); border-radius:9px; padding:9px 11px; margin-bottom:7px;
    max-width:100%; overflow:hidden;
  }
  .link-item a{
    color:var(--rust); text-decoration:none; font-weight:600; font-size:13.5px;
    word-break:break-all; overflow-wrap:break-word; display:block; max-width:100%;
  }
  .link-item .link-label{font-size:12px; color:var(--muted); margin-bottom:2px;}
  .yt-embed{width:100%; aspect-ratio:16/9; border-radius:9px; margin-top:8px; border:none;}
  .ig-card{
    display:flex; align-items:center; gap:8px; margin-top:8px; padding:12px 14px; border-radius:9px;
    background:linear-gradient(135deg, #f9ce34, #ee2a7b 40%, #6228d7 90%); color:#fff; font-size:13.5px;
    font-weight:600; cursor:pointer;
  }
  .ig-card .ig-icon{font-size:12px;}
  .link-item .link-del{color:var(--muted); font-size:12px; cursor:pointer; float:right;}
  textarea.notes-area{
    width:100%; min-height:70px; border-radius:9px; border:1px solid var(--line); padding:9px 11px;
    font-size:16px; font-family:inherit; background:#fff; resize:vertical;
  }
  .inline-add{display:flex; gap:6px; margin-top:8px;}
  .inline-add input{
    flex:1; padding:8px 10px; border-radius:8px; border:1px solid var(--line); font-size:16px; background:#fff;
    min-width:0;
  }
  .inline-add button{
    padding:8px 13px; border-radius:8px; border:none; background:var(--sage); color:#fff; font-size:13px; cursor:pointer; font-weight:600;
  }
  .video-add-form{
    display:flex; flex-direction:column; gap:8px; margin-top:10px; max-width:100%;
  }
  .video-add-form input{
    width:100%; max-width:100%; box-sizing:border-box; padding:10px 12px; border-radius:8px;
    border:1px solid var(--line); font-size:16px; background:#fff; min-width:0;
  }
  .video-add-btn{ font-size:13px; line-height:1.3; }
  .nudge-hint{font-size:11.5px; color:var(--muted); margin-top:6px; line-height:1.4;}
  .delete-exercise-link{
    display:block; text-align:center; color:var(--danger); font-size:12.5px; margin-top:10px; cursor:pointer;
  }

  .add-exercise-btn{
    width:100%; padding:12px; border-radius:12px; border:1.5px dashed var(--sage); background:transparent;
    color:var(--sage-dark); font-size:14px; font-weight:600; cursor:pointer; margin-top:4px;
  }

  .circuit-timer-btn{
    width:100%; padding:14px 16px; border-radius:var(--radius); border:none;
    background:linear-gradient(135deg, var(--sage-dark), var(--sage)); color:#fff;
    display:flex; align-items:center; gap:12px; cursor:pointer; margin-bottom:16px;
    box-shadow:0 3px 10px rgba(61,74,61,.25);
  }
  .circuit-timer-btn .icon{font-size:22px; flex-shrink:0;}
  .circuit-timer-btn .text{text-align:left; flex:1;}
  .circuit-timer-btn .title{font-size:15px; font-weight:700;}
  .circuit-timer-btn .sub{font-size:12px; opacity:.85; margin-top:1px;}

  /* Exercise picker sheet */
  .picker-search{
    width:100%; padding:11px 13px; border-radius:10px; border:1px solid var(--line); font-size:16px;
    margin-bottom:12px; background:#fff;
  }
  .picker-item{
    display:flex; justify-content:space-between; align-items:center; padding:11px 4px; border-bottom:1px solid var(--line);
    -webkit-user-select:none; user-select:none;
  }
  .picker-item.selected{background:#eef3ea; margin:0 -8px; padding-left:12px; padding-right:8px; border-radius:8px;}
  .picker-item-left{display:flex; align-items:center; flex:1; min-width:0; cursor:pointer;}
  .picker-icon{width:26px; height:26px; flex-shrink:0; color:var(--sage-dark); margin-right:10px;}
  .picker-icon svg{width:100%; height:100%; display:block;}
  .picker-item .pname{font-size:14.5px; cursor:pointer; flex:1;}
  .picker-checkbox{
    width:22px; height:22px; border-radius:6px; border:1.5px solid var(--line); background:#fff;
    display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-right:10px; color:#fff; font-size:13px;
  }
  .picker-checkbox.checked{background:var(--sage); border-color:var(--sage);}
  .picker-multiselect-bar{
    display:flex; align-items:center; justify-content:space-between; padding:8px 4px 12px;
    font-size:13px; color:var(--muted);
  }
  .picker-multiselect-bar .cancel-select{color:var(--sage-dark); font-weight:600; cursor:pointer;}
  .picker-add-selected-btn{
    width:100%; padding:13px; border-radius:12px; border:none; background:var(--sage);
    color:#fff; font-size:15.5px; font-weight:600; cursor:pointer; margin-bottom:10px;
  }
  .picker-add-selected-btn:disabled{background:#c9c9bd; cursor:not-allowed;}

  .autocomplete-wrap{position:relative;}
  .autocomplete-dropdown{
    position:absolute; top:calc(100% + 4px); left:0; right:0; background:#fff;
    border:1px solid var(--line); border-radius:12px; max-height:260px; overflow-y:auto;
    box-shadow:0 6px 20px rgba(0,0,0,.12); z-index:50;
  }
  .autocomplete-dropdown .picker-item{padding:10px 12px; border-bottom:1px solid var(--line);}
  .autocomplete-dropdown .picker-item:last-child{border-bottom:none;}
  .autocomplete-add-new{
    display:flex; align-items:center; gap:8px; padding:12px; cursor:pointer; color:var(--sage-dark); font-weight:600; font-size:14px;
  }
  .autocomplete-add-new:hover{background:#faf9f4;}
  .autocomplete-empty{padding:14px 12px; color:var(--muted); font-size:13px;}
  .picker-item .pdel{color:var(--muted); font-size:12px; cursor:pointer; padding:4px 8px;}
  .picker-new{
    display:flex; gap:8px; margin-top:10px; padding-top:10px; border-top:1px dashed var(--line);
  }
  .toast{
    position:fixed; bottom:100px; left:50%; transform:translateX(-50%); background:var(--sage-dark); color:#fff;

}
.ct-header{

}
.ct-header h2{font-size:18px; margin:0; font-weight:600;}
.ct-close{font-size:20px; cursor:pointer; padding:2px 6px;}
.ct-screen{padding:16px 16px 30px; overflow-y:auto; height:calc(100% - 56px);}

.ct-section{
  background:var(--card); border-radius:var(--radius); padding:16px; margin-bottom:14px; border:1px solid var(--line);
}
.ct-section h3{font-size:14px; text-transform:uppercase; letter-spacing:.4px; color:var(--muted); margin:0 0 12px;}
.ct-config-row{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;}
.ct-config-row:last-child{margin-bottom:0;}
.ct-config-row label{font-size:14.5px; font-weight:600;}
.ct-stepper{display:flex; align-items:center; gap:10px;}
.ct-stepper button{
  width:34px; height:34px; border-radius:8px; border:1px solid var(--line); background:#faf9f4;
  font-size:18px; color:var(--sage-dark); cursor:pointer;
}
.ct-stepper .ct-val{min-width:52px; text-align:center; font-size:15px; font-weight:700;}

.ct-picked-row{
  display:flex; align-items:center; gap:10px; background:#faf9f4; border:1px solid var(--line);
  border-radius:10px; padding:8px 10px; margin-bottom:8px;
}
.ct-picked-row .pos{
  width:22px; height:22px; border-radius:50%; background:var(--sage); color:#fff; font-size:12px;
  font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
.ct-picked-row .icon{width:26px; height:26px; color:var(--sage-dark); flex-shrink:0;}
.ct-picked-row .icon svg{width:100%; height:100%;}
.ct-picked-row .name{flex:1; font-size:14px; font-weight:600; min-width:0;}
.ct-picked-row .remove{color:var(--muted); font-size:13px; cursor:pointer; flex-shrink:0;}
.ct-summary{font-size:13px; color:var(--muted); margin-top:10px; line-height:1.5;}

.ct-test-sound{
  width:100%; padding:12px; border-radius:12px; border:1.5px solid var(--line); background:transparent;
  color:var(--ink); font-size:14.5px; cursor:pointer; margin-bottom:10px;
}
.ct-start-btn{
  width:100%; padding:16px; border-radius:14px; border:none; background:var(--sage-dark); color:#fff;
  font-size:16px; font-weight:700; cursor:pointer;
}
.ct-start-btn:disabled{background:#c9c9bd; cursor:not-allowed;}

.ct-picker-item{
  display:flex; align-items:center; gap:10px; padding:10px 4px; border-bottom:1px solid var(--line); cursor:pointer;
}
.ct-picker-item .icon{width:26px; height:26px; color:var(--sage-dark); flex-shrink:0;}
.ct-picker-item .icon svg{width:100%; height:100%;}
.ct-picker-item .pname{font-size:14.5px; flex:1;}

#ctRunningScreen{position:fixed; inset:0; background:var(--bg); z-index:101; display:flex; flex-direction:column;}
.ct-run-phase-band{padding:14px 20px 40px; text-align:center; color:#fff; transition:background .4s ease;}
.ct-run-phase-band.work{background:var(--sage);}
.ct-run-phase-band.rest{background:var(--rust);}
.ct-run-phase-band.end{background:var(--sage-dark);}
.ct-run-phase-label{font-size:13px; text-transform:uppercase; letter-spacing:1px; opacity:.85; font-weight:700;}
.ct-run-round-label{font-size:13px; opacity:.75; margin-top:2px;}
.ct-run-body{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; margin-top:-24px;}

.ct-exercise-display{
  background:var(--card); border-radius:20px; padding:28px 24px; text-align:center; box-shadow:0 8px 24px rgba(0,0,0,.12);
  width:100%; max-width:320px; margin-bottom:28px;
}
.ct-exercise-display .ct-icon{width:76px; height:76px; margin:0 auto 12px; color:var(--sage-dark);}
.ct-exercise-display .ct-icon svg{width:100%; height:100%;}
.ct-exercise-display .ct-ex-name{font-size:19px; font-weight:700; line-height:1.3;}
.ct-exercise-display .ct-ex-position{font-size:12.5px; color:var(--muted); margin-top:6px; text-transform:uppercase; letter-spacing:.4px;}

.ct-countdown-ring-wrap{position:relative; width:180px; height:180px; margin-bottom:20px;}
.ct-countdown-ring-wrap svg{width:100%; height:100%; transform:rotate(-90deg);}
.ct-ring-bg{fill:none; stroke:var(--line); stroke-width:10;}
.ct-ring-fg{fill:none; stroke-width:10; stroke-linecap:round; transition:stroke-dashoffset 0.3s linear, stroke 0.4s ease;}
.ct-countdown-center{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;}
.ct-countdown-time{font-size:38px; font-weight:800; font-variant-numeric:tabular-nums; letter-spacing:-1px;}
.ct-countdown-sub{font-size:11.5px; color:var(--muted); margin-top:2px;}
.ct-imminent-flash{animation:ctFlashPulse 1s ease-in-out infinite;}
@keyframes ctFlashPulse{ 0%,100%{transform:scale(1);} 50%{transform:scale(1.05);} }

.ct-session-progress{display:flex; gap:5px; margin-top:6px; flex-wrap:wrap; justify-content:center; max-width:280px;}
.ct-session-progress .seg{width:22px; height:5px; border-radius:3px; background:var(--line);}
.ct-session-progress .seg.done{background:var(--sage-dark);}
.ct-session-progress .seg.current{background:var(--rust);}

.ct-run-controls{display:flex; gap:10px; padding:16px 20px 28px;}
.ct-run-controls button{flex:1; padding:14px; border-radius:12px; border:none; font-size:14.5px; font-weight:700; cursor:pointer;}
.ct-pause-btn{background:var(--sage-dark); color:#fff;}
.ct-end-btn{background:transparent; border:1.5px solid var(--danger) !important; color:var(--danger);}

#ctPreStartOverlay{
  position:fixed; inset:0; background:var(--sage-dark); color:#fff; z-index:103;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
}
.ct-prestart-label{font-size:15px; text-transform:uppercase; letter-spacing:1px; opacity:.8; margin-bottom:8px;}
.ct-prestart-num{font-size:88px; font-weight:800; font-variant-numeric:tabular-nums;}

#ctCompletionOverlay{
  position:fixed; inset:0; background:var(--sage-dark); color:#fff; z-index:102;
  display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:40px;
}
.ct-completion-big{font-size:24px; font-weight:800; margin-bottom:10px;}
#ctCompletionOverlay button{
  margin-top:24px; padding:14px 28px; border-radius:12px; border:none; background:#fff; color:var(--sage-dark);
  font-size:15px; font-weight:700; cursor:pointer;
}

<body>

<header>
  <span class="back hidden" id="backBtn">←</span>
  <h1 id="headerTitle" onclick="handleHeaderTap()">Workout Log</h1>
  <div class="header-actions" id="landingActions">
    <span class="header-action-icon" title="Stats" onclick="showStats()"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:block"><path d="M5 20V11M12 20V4M19 20v-6"/></svg></span>
  </div>
  <div class="header-actions hidden" id="headerActions">
    <span class="header-action-icon" title="Edit date" onclick="openDateEditSheet()">✎</span>
    <span class="header-action-icon" title="Copy to today" onclick="copyWorkout(currentWorkoutId)">⧉</span>
    <span class="header-action-icon danger" title="Delete" onclick="confirmDeleteWorkout(currentWorkoutId)">✕</span>
  </div>
</header>

<!-- LANDING -->
<div class="screen" id="landingScreen">
  <div id="dayList"></div>
</div>

<!-- STATS -->
<div class="screen hidden" id="statsScreen"></div>

<!-- WORKOUT DETAIL -->
<div class="screen hidden" id="workoutScreen">
  <div id="circuitTimerLaunch" class="hidden"></div>

  <div class="section-label section-toggle" id="warmupLabel" onclick="toggleSection('warmup')"></div>
  <div id="warmupSection">
    <div id="warmupExercises"></div>
    <button class="add-exercise-btn" onclick="openPicker('warmup')">+ Add warmup exercise</button>
  </div>

  <div class="section-label section-toggle" id="mainLabel" onclick="toggleSection('main')"></div>
  <div id="mainSection">
    <div id="mainExercises"></div>
    <button class="add-exercise-btn" onclick="openPicker('main')">+ Add exercise</button>
  </div>
</div>

<button class="fab" id="fabAdd" onclick="openNewWorkoutSheet()">+</button>

<div id="modalRoot"></div>

<!-- CIRCUIT TIMER OVERLAY -->
<div id="circuitTimerOverlay" class="hidden">
  <div id="ctSetupScreen">
    <div class="ct-header">
      <span class="ct-close" onclick="closeCircuitTimer()">✕</span>
      <h2>Circuit Timer</h2>
      <span style="width:20px"></span>
    </div>
    <div class="ct-screen">
      <div class="ct-section">
        <h3>Structure</h3>
        <div class="ct-config-row">
          <label>Rounds</label>
          <div class="ct-stepper">
            <button onclick="ctAdjustConfig('rounds',-1)">−</button>
            <span class="ct-val" id="ctRoundsVal">4</span>
            <button onclick="ctAdjustConfig('rounds',1)">+</button>
          </div>
        </div>
        <div class="ct-config-row">
          <label>Work (min:sec)</label>
          <div class="ct-stepper">
            <button onclick="ctAdjustConfig('workSeconds',-30)">−</button>
            <span class="ct-val" id="ctWorkVal">4:00</span>
            <button onclick="ctAdjustConfig('workSeconds',30)">+</button>
          </div>
        </div>
        <div class="ct-config-row">
          <label>Rest (min:sec)</label>
          <div class="ct-stepper">
            <button onclick="ctAdjustConfig('restSeconds',-30)">−</button>
            <span class="ct-val" id="ctRestVal">3:00</span>
            <button onclick="ctAdjustConfig('restSeconds',30)">+</button>
          </div>
        </div>
      </div>

      <div class="ct-section">
        <h3>Circuit exercises</h3>
        <div id="ctPickedList"></div>
        <button class="add-exercise-btn" onclick="ctOpenExercisePicker()">+ Add exercise to circuit</button>
        <div class="ct-summary" id="ctScheduleSummary"></div>
      </div>

      <button class="ct-test-sound" onclick="ctPlayTestTone()">🔊 Test sound</button>
      <button class="ct-start-btn" id="ctStartBtn" onclick="ctStartSession()" disabled>Select at least 1 exercise to start</button>
    </div>
  </div>

  <div id="ctRunningScreen" class="hidden">
    <div class="ct-run-phase-band" id="ctRunPhaseBand">
      <div class="ct-run-phase-label" id="ctRunPhaseLabel">WORK</div>
      <div class="ct-run-round-label" id="ctRunRoundLabel">Round 1 of 4</div>
    </div>
    <div class="ct-run-body">
      <div class="ct-countdown-ring-wrap">
        <svg viewBox="0 0 100 100">
          <circle class="ct-ring-bg" cx="50" cy="50" r="44"/>
          <circle class="ct-ring-fg" id="ctRingFg" cx="50" cy="50" r="44"
                  stroke-dasharray="276.5" stroke-dashoffset="0" stroke="#5a6b52"/>
        </svg>
        <div class="ct-countdown-center">
          <div class="ct-countdown-time" id="ctCountdownTime">4:00</div>
          <div class="ct-countdown-sub" id="ctCountdownSub">until rest</div>
        </div>
      </div>
      <div class="ct-exercise-display" id="ctExerciseDisplay">
        <div class="ct-icon" id="ctExerciseDisplayIcon"></div>
        <div class="ct-ex-name" id="ctExerciseDisplayName">—</div>
        <div class="ct-ex-position" id="ctExerciseDisplayPosition"></div>
      </div>
      <div class="ct-session-progress" id="ctSessionProgress"></div>
    </div>
    <div class="ct-run-controls">
      <button class="ct-pause-btn" id="ctPauseBtn" onclick="ctTogglePause()">Pause</button>
      <button class="ct-end-btn" onclick="ctEndSessionConfirm()">End</button>
    </div>
  </div>

  <div id="ctPreStartOverlay" class="hidden">
    <div class="ct-prestart-label">Get ready</div>
    <div class="ct-prestart-num" id="ctPreStartNum">5</div>
  </div>

  <div id="ctCompletionOverlay" class="hidden">
    <div class="ct-completion-big">Circuit complete 🎉</div>
    <div id="ctCompletionSummary" style="font-size:14px; opacity:.85;"></div>
    <button onclick="closeCircuitTimer()">Done</button>
  </div>
</div>

  const raw = localStorage.getItem(DB_KEY);

}

{

function showWorkout(workoutId){
  openSwipeCard = null; // stale reference once we leave the landing screen
  lastEditedInstId = null; // fresh collapse-on-edit tracking for this workout view
  currentWorkoutId = workoutId;
  document.getElementById('statsScreen').classList.add('hidden');
  document.getElementById('landingActions').classList.add('hidden');
  document.getElementById('landingScreen').classList.add('hidden');
  document.getElementById('workoutScreen').classList.remove('hidden');
  document.getElementById('backBtn').classList.remove('hidden');
  document.getElementById('fabAdd').classList.add('hidden');
  document.getElementById('headerActions').classList.remove('hidden');
  const w = db.workouts.find(x=>x.id===workoutId);
  const h1 = document.getElementById('headerTitle');
  h1.textContent = formatDateShort(w.date);
  h1.classList.add('editable');
  renderWorkout();
}
document.getElementById('backBtn').onclick = showLanding;

function handleHeaderTap(){
  if(!currentWorkoutId) return; // landing screen, no-op
  openDateEditSheet();
}
function openDateEditSheet(){
  const w = getWorkout();
  const overlay = document.createElement('div');
  overlay.className = 'sheet-overlay';
  overlay.innerHTML = `
    <div class="sheet">
      <h2>Edit workout date</h2>
      <input type="date" class="picker-search" id="editDateInput" value="${w.date}" style="margin-bottom:16px;">
      <button class="btn-primary" id="saveDateBtn">Save</button>
      <button class="btn-secondary" onclick="this.closest('.sheet-overlay').remove()">Cancel</button>
    </div>`;
  document.getElementById('modalRoot').appendChild(overlay);
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) overlay.remove(); });
  document.getElementById('saveDateBtn').onclick = ()=>{
    const newDate = document.getElementById('editDateInput').value;
    if(!newDate) return;
    w.date = newDate;
    saveDB();
    overlay.remove();
    showWorkout(w.id); // refreshes header text; landing list re-sorts on next visit
  };
}

/* ---------------- Copy / delete workout ---------------- */
function cloneExerciseInstance(inst){
  const copy = { ...inst, id: uid() };
  if(Array.isArray(inst.sets)){
    copy.sets = blankSetsFrom(inst); // copied workouts start with blank, unchecked sets
  }
  return copy;
}

function localDateStr(d){
  d = d || new Date();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return d.getFullYear()+'-'+m+'-'+day;
}

function copyWorkout(workoutId, evt){
  if(evt) evt.stopPropagation();
  const source = db.workouts.find(w=>w.id===workoutId);
  if(!source) return;
  const today = localDateStr();
  const newWorkout = {
    id: uid(),
    date: today,
    types: [...source.types],
    createdAt: Date.now(),
    warmup: source.warmup.map(cloneExerciseInstance),
    main: source.main.map(cloneExerciseInstance)
  };
  db.workouts.push(newWorkout);
  saveDB();
  showWorkout(newWorkout.id);
  showToast('Workout copied to today');
}

function confirmDeleteWorkout(workoutId, evt){
  if(evt) evt.stopPropagation();
  closeOpenSwipeCard();
  const w = db.workouts.find(x=>x.id===workoutId);
  if(!w) return;
  const overlay = document.createElement('div');
  overlay.className = 'sheet-overlay';
  overlay.innerHTML = `
    <div class="sheet">
      <h2>Delete this workout?</h2>
      <p style="color:var(--muted); font-size:14px; margin:-6px 0 18px;">${formatDateLong(w.date)} — ${escapeHtml(w.types.join(', '))}. This cannot be undone.</p>
      <button class="btn-primary" style="background:var(--danger);" id="confirmDeleteBtn">Delete workout</button>
      <button class="btn-secondary" onclick="this.closest('.sheet-overlay').remove()">Cancel</button>
    </div>`;
  document.getElementById('modalRoot').appendChild(overlay);
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) overlay.remove(); });
  document.getElementById('confirmDeleteBtn').onclick = ()=>{
    overlay.remove();
    deleteWorkout(workoutId);
  };
}
function deleteWorkout(workoutId){
  db.workouts = db.workouts.filter(w=>w.id!==workoutId);
  saveDB();
  if(currentWorkoutId===workoutId){
    showLanding();
  } else {
    renderLanding();
  }
}

function formatDateShort(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  return d.toLocaleDateString('en-US',{weekday:'short', month:'short', day:'numeric'});
}
function formatDateLong(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  return d.toLocaleDateString('en-US',{weekday:'long', month:'long', day:'numeric', year:'numeric'});
}

/* ---------------- Swipe-to-reveal (copy/delete) ---------------- */
const SWIPE_REVEAL_WIDTH = 128; // two 64px action buttons
let openSwipeCard = null; // currently-revealed card element, if any

function closeOpenSwipeCard(){
  if(openSwipeCard){
    openSwipeCard.style.transform = 'translateX(0)';
    openSwipeCard = null;
  }
}

function handleDayCardTap(workoutId, evt){
  // If a card is open (swiped), tapping it just closes it rather than navigating.
  if(openSwipeCard){
    evt.preventDefault();
    closeOpenSwipeCard();
    return;
  }
  showWorkout(workoutId);
}

function initSwipeCards(){
  document.querySelectorAll('.day-card').forEach(card=>{
    let startX = 0, startY = 0, baseX = 0, dragging = false, decided = null, liveX = 0;

    card.addEventListener('touchstart', (e)=>{
      if(openSwipeCard && openSwipeCard!==card) closeOpenSwipeCard();
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
      baseX = card===openSwipeCard ? -SWIPE_REVEAL_WIDTH : 0;
      liveX = baseX;
      dragging = true;
      decided = null;
      card.style.transition = 'none';
    }, {passive:true});

    card.addEventListener('touchmove', (e)=>{
      if(!dragging) return;
      const dx = e.touches[0].clientX - startX;
      const dy = e.touches[0].clientY - startY;

      if(decided===null){
        if(Math.abs(dx) > 6 || Math.abs(dy) > 6){
          decided = Math.abs(dx) > Math.abs(dy) ? 'horizontal' : 'vertical';
        }
      }
      if(decided==='vertical'){ dragging=false; return; } // let the page scroll normally
      if(decided!=='horizontal') return;

      e.preventDefault(); // we're handling this swipe ourselves
      liveX = Math.max(-SWIPE_REVEAL_WIDTH, Math.min(0, baseX + dx));
      card.style.transform = `translateX(${liveX}px)`;
    }, {passive:false});

    card.addEventListener('touchend', ()=>{
      if(!dragging){ decided=null; return; }
      dragging = false;
      card.style.transition = 'transform .2s ease';
      if(liveX < -SWIPE_REVEAL_WIDTH/2){
        card.style.transform = `translateX(-${SWIPE_REVEAL_WIDTH}px)`;
        openSwipeCard = card;
      } else {
        card.style.transform = 'translateX(0)';
        if(openSwipeCard===card) openSwipeCard = null;
      }
      decided = null;
    });
  });
}


/* ---------------- Charts ---------------- */
function chartTap(el, readoutId){
  const r = document.getElementById(readoutId);
  if(r) r.textContent = el.getAttribute('data-txt') || '';
}
function lineChartSvg(points, readoutId){
  // points: [{value, txt, pr, axis}] evenly spaced, oldest first
  const W=320, H=150, L=40, R=12, T=12, B=24;
  const vals = points.map(p=>p.value);
  let min = Math.min(...vals), max = Math.max(...vals);
  if(min===max){ min -= 1; max += 1; }
  const pad = (max-min)*0.12; min = Math.max(0, min-pad); max = max+pad;
  const x = i => points.length===1 ? L+(W-L-R)/2 : L+(W-L-R)*i/(points.length-1);
  const y = v => T+(H-T-B)*(1-(v-min)/(max-min));
  const fmtAxis = points[0].axis;
  let g = '';
  [min, (min+max)/2, max].forEach(v=>{
    g += `<line class="ch-grid" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text class="ch-axis" x="${L-5}" y="${y(v)+3}" text-anchor="end">${escapeHtml(fmtAxis(v))}</text>`;
  });
  const path = points.map((p,i)=>`${i?'L':'M'}${x(i).toFixed(1)} ${y(p.value).toFixed(1)}`).join(' ');
  const dots = points.map((p,i)=>`<circle class="ch-dot ${p.pr?'pr':''}" cx="${x(i).toFixed(1)}" cy="${y(p.value).toFixed(1)}" r="4"/>`).join('');
  const hits = points.map((p,i)=>`<circle class="ch-hit" cx="${x(i).toFixed(1)}" cy="${y(p.value).toFixed(1)}" r="14" data-txt="${escapeHtml(p.txt)}" onclick="chartTap(this,'${readoutId}')"/>`).join('');
  const first = points[0].label, last = points[points.length-1].label;
  const xl = `<text class="ch-axis" x="${x(0)}" y="${H-6}" text-anchor="${points.length===1?'middle':'start'}">${escapeHtml(first)}</text>` +
             (points.length>1 ? `<text class="ch-axis" x="${x(points.length-1)}" y="${H-6}" text-anchor="end">${escapeHtml(last)}</text>` : '');
  return `<svg viewBox="0 0 ${W} ${H}" role="img">${g}${points.length>1?`<path class="ch-line" d="${path}"/>`:''}${dots}${xl}${hits}</svg>`;
}
function barChartSvg(bars, readoutId){
  // bars: [{value, label, txt, cur}]
  const W=320, H=140, L=8, R=8, T=14, B=22;
  const max = Math.max(1, ...bars.map(b=>b.value));
  const slot = (W-L-R)/bars.length, bw = slot*0.62;
  let out = '';
  bars.forEach((b,i)=>{
    const h = (H-T-B)*(b.value/max);
    const bx = L+slot*i+(slot-bw)/2, by = H-B-h;
    out += `<rect class="ch-bar ${b.cur?'cur':''}" x="${bx.toFixed(1)}" y="${by.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(h,b.value>0?2:0).toFixed(1)}" rx="3"/>`;
    if(b.label) out += `<text class="ch-axis" x="${(bx+bw/2).toFixed(1)}" y="${H-7}" text-anchor="middle" style="font-size:8.5px">${escapeHtml(b.label)}</text>`;
    out += `<rect class="ch-hit" x="${(L+slot*i).toFixed(1)}" y="0" width="${slot.toFixed(1)}" height="${H-B}" data-txt="${escapeHtml(b.txt)}" onclick="chartTap(this,'${readoutId}')"/>`;
  });
  out += `<line class="ch-grid" x1="${L}" x2="${W-R}" y1="${H-B}" y2="${H-B}"/>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img">${out}</svg>`;
}

/* ---------------- Per-exercise history ---------------- */
const HIST_METRICS = [
  {k:'e1rm',   label:'Est. 1RM',   fmt:v=>Math.round(v)+' lb'},
  {k:'weight', label:'Top weight', fmt:v=>v+' lb'},
  {k:'volume', label:'Volume',     fmt:v=>Math.round(v).toLocaleString()+' lb'},
  {k:'reps',   label:'Top reps',   fmt:v=>v+' reps'},
  {k:'time',   label:'Best time',  fmt:v=>formatTimeValue(v)}
];
function sessionMetrics(ses){
  const t = ses.inst.secondaryType || 'weight';
  const cs = ses.inst.sets.filter(isCounted);
  const out = {};
  if(t==='weight'){
    let e=0, wt=0, vol=0;
    cs.forEach(x=>{
      if(x.reps>0){ e = Math.max(e, e1rmOf(x.weight, x.reps)); if(x.weight>0) wt = Math.max(wt, x.weight); }
      vol += (x.reps||0)*(x.weight||0);
    });
    if(e>0) out.e1rm = e; if(wt>0) out.weight = wt; if(vol>0) out.volume = vol;
  }
  let r = 0; cs.forEach(x=>{ if(x.reps>0) r = Math.max(r, x.reps); });
  if(r>0) out.reps = r;
  if(t==='time'){ let tm=0; cs.forEach(x=>{ tm = Math.max(tm, x.time||0); }); if(tm>0) out.time = tm; }
  return out;
}
function setHistMetric(instId, k){
  const cur = openExerciseDetail[instId] || {open:true, tab:'history'};
  openExerciseDetail[instId] = { ...cur, metric:k };
  renderWorkout();
}
function toggleHistAll(instId){
  const cur = openExerciseDetail[instId] || {open:true, tab:'history'};
  openExerciseDetail[instId] = { ...cur, showAll: !cur.showAll };
  renderWorkout();
}
function renderHistoryPane(inst, def, state){
  const sessions = getExerciseSessions(def.id);
  if(sessions.length===0) return `<div style="color:var(--muted);">No history yet. Check off some sets and they will show up here.</div>`;
  const mets = sessions.map(sessionMetrics);
  const avail = HIST_METRICS.filter(m=> mets.some(x=>x[m.k]!=null));
  let metric = avail.find(m=>m.k===state.metric) || avail[0];
  let chartHtml = '';
  if(metric){
    const pts = []; let runMax = 0, seen = 0;
    sessions.forEach((ses,i)=>{
      const v = mets[i][metric.k]; if(v==null) return;
      const pr = seen>0 && v>runMax; seen++; runMax = Math.max(runMax, v);
      const d = new Date(ses.workout.date+'T00:00:00');
      pts.push({value:v, pr, axis:(a)=>metric.k==='time'?formatTimeValue(Math.round(a)):String(Math.round(a)),
        label:d.toLocaleDateString('en-US',{month:'short',day:'numeric'}),
        txt: fmtDateY(ses.workout.date)+' · '+metric.fmt(v)+(pr?' · record':'')});
    });
    const rid = 'chartReadout-'+inst.id;
    chartHtml = `
      <div class="metric-chips">${avail.map(m=>`<span class="metric-chip ${m.k===metric.k?'active':''}" onclick="setHistMetric('${inst.id}','${m.k}')">${m.label}</span>`).join('')}</div>
      <div class="chart-wrap">${lineChartSvg(pts, rid)}</div>
      <div class="chart-readout" id="${rid}">${escapeHtml(pts[pts.length-1].txt)}</div>`;
  }
  // records
  let recHtml = '';
  const wSes = sessions.filter(x=>(x.inst.secondaryType||'weight')==='weight');
  if(wSes.length){
    let bestE={v:0,d:''}, bestW={v:0,d:''}, bestV={v:0,d:'',desc:''}; const repsAt = {};
    wSes.forEach(ses=>ses.inst.sets.forEach(x=>{
      if(!isCounted(x) || !(x.reps>0)) return;
      const w = x.weight||0, e = e1rmOf(w,x.reps), vol = x.reps*w;
      if(e>bestE.v) bestE={v:e,d:ses.workout.date};
      if(w>bestW.v) bestW={v:w,d:ses.workout.date};
      if(vol>bestV.v) bestV={v:vol,d:ses.workout.date,desc:x.reps+'×'+w};
      if(!repsAt[w] || x.reps>repsAt[w].r) repsAt[w]={r:x.reps,d:ses.workout.date};
    }));
    const card=(k,v,d)=>`<div class="rec-card"><div class="k">${k}</div><div class="v">${v}</div><div class="d">${d}</div></div>`;
    recHtml = `<div class="hist-h">Records</div><div class="rec-grid">
      ${bestW.v?card('Heaviest',bestW.v+' lb',fmtDateY(bestW.d)):''}
      ${bestE.v?card('Est. 1RM',Math.round(bestE.v)+' lb',fmtDateY(bestE.d)):''}
      ${bestV.v?card('Best set volume',Math.round(bestV.v).toLocaleString()+' lb',bestV.desc+' · '+fmtDateY(bestV.d)):''}
    </div>`;
    const ws = Object.keys(repsAt).map(Number).sort((a,b)=>b-a).slice(0,6);
    if(ws.length) recHtml += `<div class="hist-h">Best reps at weight</div><table class="raw-table">${ws.map(w=>`<tr><td>${w>0?w+' lb':'Bodyweight'}</td><td><b>${repsAt[w].r} reps</b></td><td style="color:var(--muted);text-align:right">${fmtDateY(repsAt[w].d)}</td></tr>`).join('')}</table>`;
  }
  const tSes = sessions.filter(x=>x.inst.secondaryType==='time');
  if(tSes.length){
    let bt=0, bd='';
    tSes.forEach(ses=>ses.inst.sets.forEach(x=>{ if(isCounted(x) && (x.time||0)>bt){ bt=x.time; bd=ses.workout.date; } }));
    if(bt>0) recHtml += `<div class="rec-grid"><div class="rec-card"><div class="k">Longest hold</div><div class="v">${formatTimeValue(bt)}</div><div class="d">${fmtDateY(bd)}</div></div></div>`;
  }
  // past sessions
  const desc = [...sessions].reverse();
  const shown = state.showAll ? desc : desc.slice(0,8);
  const rows = shown.map(ses=>{
    const prs = computePRsForInstance(ses.inst, ses.workout, sessions);
    const t = ses.inst.secondaryType || 'weight';
    const sets = ses.inst.sets.filter(x=>x.done!==false && (x.reps>0 || x.time>0)).map(x=>fmtSet(x,t)).join(' · ');
    return `<div class="hist-row"><div class="hd"><span>${fmtDateY(ses.workout.date)}${Object.keys(prs).length?`<span class="pr-badge">${TROPHY_SVG} PR</span>`:''}</span><span style="color:var(--muted);font-weight:500">${escapeHtml(ses.workout.types.join(', '))}</span></div><div class="sets">${escapeHtml(sets)}</div></div>`;
  }).join('');
  const more = desc.length>8 ? `<button class="btn-text" onclick="toggleHistAll('${inst.id}')">${state.showAll?'Show fewer':'Show all '+desc.length+' sessions'}</button>` : '';
  return `${chartHtml}${recHtml}<div class="hist-h">All sessions</div>${rows}${more}`;
}

/* ---------------- Stats screen ---------------- */
let statsMetric = 'volume';
let statsMonth = null;
function weekStartStr(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  d.setDate(d.getDate() - ((d.getDay()+6)%7)); // Monday start
  return localDateStr(d);
}
function workoutCounts(w){
  const all = [...(w.warmup||[]), ...(w.main||[])];
  return all.length===0 || all.some(hasLoggedSets);
}
function workoutTotals(w){
  let sets=0, vol=0;
  (w.main||[]).forEach(inst=>{
    const t = inst.secondaryType || 'weight';
    inst.sets.forEach(x=>{
      if(!isCounted(x) || !(x.reps>0 || x.time>0)) return;
      sets++;
      if(t==='weight') vol += (x.reps||0)*(x.weight||0);
    });
  });
  return {sets, vol};
}
function fmtVol(v){ return v>=10000 ? (v/1000).toFixed(1)+'k' : Math.round(v).toLocaleString(); }

function showStats(){

function setStatsMetric(k){ statsMetric = k; renderStats(); }
function shiftStatsMonth(delta){

function renderStats(){
  const el = document.getElementById('statsScreen');

    const k = weekStartStr(w.date); const t = workoutTotals(w);

  });
  // last 12 weeks, oldest first
  const thisWeek = weekStartStr(localDateStr());
  const keys = [];
  { const d = new Date(thisWeek+'T00:00:00'); for(let i=11;i>=0;i--){ const x = new Date(d); x.setDate(x.getDate()-7*i); keys.push(localDateStr(x)); } }
  const zero = {workouts:0, sets:0, vol:0};

  const mdef = {
    volume:{label:'Volume', get:o=>o.vol, fmt:v=>fmtVol(v)+' lb'},
    workouts:{label:'Workouts', get:o=>o.workouts, fmt:v=>v+(v===1?' workout':' workouts')},

      txt:'Week of '+d.toLocaleDateString('en-US',{month:'short',day:'numeric'})+' · '+md.fmt(md.get(o))};
  });
  const rid = 'statsReadout';
  // calendar
  const {y,m} = statsMonth;
  const first = new Date(y,m,1), offset = (first.getDay()+6)%7, dim = new Date(y,m+1,0).getDate();
  const days = {}; counted.forEach(w=>{ days[w.date] = (days[w.date]||0)+1; });

    const has = days[ds]; if(has) monthCount += has;
    cells += `<button class="cal-day ${has?'has':''} ${ds===todayStr?'today':''}" ${has?`onclick="calTap('${ds}')"`:'disabled'}>${d}</button>`;
  }
  const monthName = first.toLocaleDateString('en-US',{month:'long', year:'numeric'});
  const sorted = counted.map(w=>w.date).sort();
  el.innerHTML = `
    <div class="stat-cards">
      <div class="stat-card"><div class="k">Workouts</div><div class="v">${cur.workouts}</div><div class="d">this week</div></div>
      <div class="stat-card"><div class="k">Sets</div><div class="v">${cur.sets}</div><div class="d">${dlt(cur.sets, prev.sets)}</div></div>
      <div class="stat-card"><div class="k">Volume</div><div class="v">${fmtVol(cur.vol)}</div><div class="d">${dlt(cur.vol, prev.vol)}</div></div>
    </div>
    <div class="stat-panel">

/* ---------------- Circuit timer: scheduling + audio engine ---------------- */
function buildSchedule({ rounds, workSeconds, restSeconds, exerciseCount }){
  const events = [];
  let t = 0;
  for(let round = 0; round < rounds; round++){
    events.push({ atSecond: t, type: 'round', phase: 'work', exerciseIndex: 0 });
    if(exerciseCount > 1){
      const turnLength = workSeconds / exerciseCount;
      for(let ex = 1; ex < exerciseCount; ex++){
        events.push({ atSecond: t + turnLength * ex, type: 'switch', phase: 'work', exerciseIndex: ex });
      }
    }
    t += workSeconds;
    events.push({ atSecond: t, type: 'round', phase: 'rest', exerciseIndex: null });
    t += restSeconds;
  }
  events.push({ atSecond: t, type: 'complete', phase: 'end', exerciseIndex: null });
  events.sort((a,b)=> a.atSecond - b.atSecond);
  return { events, totalSeconds: t };
}

function getStateAtTime(schedule, elapsedSeconds){
  const { events, totalSeconds } = schedule;
  if(elapsedSeconds >= totalSeconds){
    return { phase:'end', exerciseIndex:null, secondsIntoPhase:0, nextEvent:null, currentRoundEvent:null };
  }
  let currentRoundEvent = null;
  for(const e of events){
    if(e.type==='round' && e.atSecond <= elapsedSeconds) currentRoundEvent = e;
    else if(e.atSecond > elapsedSeconds) break;
  }
  let currentExerciseEvent = currentRoundEvent;
  for(const e of events){
    if((e.type==='round' || e.type==='switch') && e.atSecond <= elapsedSeconds) currentExerciseEvent = e;
    else if(e.atSecond > elapsedSeconds) break;
  }
  const nextEvent = events.find(e=> e.atSecond > elapsedSeconds) || null;
  return {
    phase: currentRoundEvent ? currentRoundEvent.phase : 'work',
    exerciseIndex: currentExerciseEvent ? currentExerciseEvent.exerciseIndex : 0,
    secondsIntoPhase: elapsedSeconds - (currentRoundEvent ? currentRoundEvent.atSecond : 0),
    nextEvent,
    currentRoundEvent
  };
}

/*
Audio engine: plays a 5-second countdown tone pattern (beeps in the final
5 seconds before each event) using the Web Audio API's own clock, which is
far more accurate than setTimeout for anything beyond a second or two.

Every scheduled oscillator is tracked so a pause can genuinely stop
already-scheduled-but-not-yet-played tones — the Web Audio API schedules
sound independently of any JS timer, so without this a "paused" session
would still play tones on the original clock.
*/
class TimerAudio {
  constructor(){
    this.ctx = null; // created lazily on first user gesture (iOS requirement)
    this._activeNodes = [];
  }

  ensureContext(){
    if(!this.ctx){
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if(this.ctx.state === 'suspended') this.ctx.resume();
    return this.ctx;
  }

  _scheduleBeep(atTime, freq, durationSec, gainPeak=0.35){
    const ctx = this.ensureContext();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, atTime);
    gain.gain.setValueAtTime(0, atTime);
    gain.gain.linearRampToValueAtTime(gainPeak, atTime + 0.02);
    gain.gain.linearRampToValueAtTime(0, atTime + durationSec);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(atTime);
    osc.stop(atTime + durationSec + 0.05);
    this._activeNodes.push({ osc, gain, atTime: atTime + durationSec + 0.05 });
  }

  scheduleCountdown(eventTimeCtxSeconds, kind){
    const baseFreq = kind==='round' ? 440 : 660;
    const now = this.ensureContext().currentTime;
    for(let i=5; i>=1; i--){
      const beepTime = eventTimeCtxSeconds - i;
      if(beepTime < now) continue;
      const pitchBoost = (5-i) * 18;
      this._scheduleBeep(beepTime, baseFreq + pitchBoost, 0.14, i===1 ? 0.45 : 0.3);
    }
  }

  scheduleCompletion(eventTimeCtxSeconds){
    const ctx = this.ensureContext();
    const notes = [523.25, 659.25, 783.99];
    notes.forEach((freq, i)=>{
      const t = eventTimeCtxSeconds + i*0.18;
      if(t < ctx.currentTime) return;
      this._scheduleBeep(t, freq, 0.35, 0.4);
    });
  }

  cancelAllPending(){
    if(!this.ctx) return;
    const now = this.ctx.currentTime;
    this._activeNodes.forEach(({ osc, gain, atTime })=>{
      if(atTime <= now) return;
      try{
        gain.gain.cancelScheduledValues(now);
        gain.gain.setValueAtTime(gain.gain.value, now);
        gain.gain.linearRampToValueAtTime(0, now + 0.03);
        osc.stop(now + 0.04);
      }catch(e){ /* already stopped — safe to ignore */ }
    });
    this._activeNodes = this._activeNodes.filter(n=> n.atTime <= now);
  }

  pruneFinished(){
    if(!this.ctx) return;
    const now = this.ctx.currentTime;
    this._activeNodes = this._activeNodes.filter(n=> n.atTime > now);
  }
}

/* ---------------- Set logic: counted sets, e1RM, history ---------------- */
// A set "counts" toward progress/PRs/volume if it is not a warmup (W) set and has not been
// explicitly left unchecked. Sets saved before check-off existed have no flag and count.
function isCounted(s){ return !s.warm && s.done!==false; }
function e1rmOf(w, r){ if(!(w>0) || !(r>0) || r>15) return 0; return r===1 ? w : w*(1+r/30); } // Epley
function hasLoggedSets(inst){ return (inst.sets||[]).some(s=> s.done!==false && ((s.reps>0) || (s.time>0))); }
function blankSet(warm){ const o={reps:null,weight:null,band:null,time:null,done:false}; if(warm) o.warm=true; return o; }
function blankSetsFrom(inst){
  const src = inst && Array.isArray(inst.sets) ? inst.sets.filter(x=>x.done!==false) : [];
  return src.length ? src.map(x=>blankSet(x.warm)) : [blankSet()];
}
function fmtDateY(d){ return new Date(d+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); }
const TROPHY_SVG = '<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4zM7 6H4v1a3 3 0 0 0 3 3M17 6h3v1a3 3 0 0 1-3 3"/></svg>';

function fmtSet(s, type){
  const reps = s.reps ?? '–';
  let sec;
  if(type==='band') sec = s.band || '–';
  else if(type==='time') sec = formatTimeValue(s.time);
  else sec = (s.weight ?? '–') + (s.weight!=null ? 'lb' : '');
  return (s.warm?'W ':'') + reps + '×' + sec;
}

function sessionsBefore(a, b){ // is workout a before workout b
  return a.date < b.date || (a.date===b.date && (a.createdAt||0) < (b.createdAt||0));
}
// Every logged appearance of an exercise, oldest first.
function getExerciseSessions(exId){
  const out = [];
  db.workouts.forEach(w=>{
    [['warmup',w.warmup],['main',w.main]].forEach(([bk,arr])=>{
      (arr||[]).forEach(inst=>{ if(inst.exerciseId===exId && hasLoggedSets(inst)) out.push({workout:w, inst, bucket:bk}); });
    });
  });
  out.sort((a,b)=> a.workout.date.localeCompare(b.workout.date) || (a.workout.createdAt||0)-(b.workout.createdAt||0));
  return out;
}
function findLastSession(exId, excludeWorkoutId){
  const sorted = [...db.workouts].filter(w=>w.id!==excludeWorkoutId).sort((a,b)=> b.date.localeCompare(a.date) || (b.createdAt||0)-(a.createdAt||0));
  for(const w of sorted){
    for(const bucket of [w.warmup, w.main]){
      const inst = (bucket||[]).find(i=>i.exerciseId===exId && hasLoggedSets(i));
      if(inst) return {inst, workout:w};
    }
  }
  return null;
}
function findLastInstance(exId, excludeWorkoutId){
  const r = findLastSession(exId, excludeWorkoutId);
  return r ? r.inst : null;
}

/* ---------------- Personal records ---------------- */
function prBestsEmpty(){ return {weight:{n:0,maxW:0,maxVol:0,maxE:0,repsAt:{}}, time:{n:0,max:0}, band:{n:0,repsAt:{}}}; }
function prAbsorb(b, s, type){
  if(type==='time'){ if(!(s.time>0)) return; b.time.n++; b.time.max = Math.max(b.time.max, s.time); return; }
  if(!(s.reps>0)) return;
  if(type==='band'){ const k = s.band || '–'; b.band.n++; b.band.repsAt[k] = Math.max(b.band.repsAt[k]||0, s.reps); return; }
  const w = s.weight||0, bw = b.weight;
  bw.n++; bw.maxW = Math.max(bw.maxW, w); bw.maxVol = Math.max(bw.maxVol, s.reps*w);
  bw.maxE = Math.max(bw.maxE, e1rmOf(w, s.reps)); bw.repsAt[w] = Math.max(bw.repsAt[w]||0, s.reps);
}
function prCheck(b, s, type){
  const out = [];
  if(type==='time'){ if(s.time>0 && b.time.n>0 && s.time>b.time.max) out.push('Time'); return out; }
  if(!(s.reps>0)) return out;
  if(type==='band'){ const k = s.band || '–'; if(b.band.n>0 && k in b.band.repsAt && s.reps>b.band.repsAt[k]) out.push('Reps with '+k+' band'); return out; }
  const w = s.weight||0, bw = b.weight;
  if(bw.n===0) return out; // nothing to beat yet
  if(w>0 && w>bw.maxW) out.push('Weight');
  if(s.reps*w>bw.maxVol && w>0) out.push('Volume');
  if(e1rmOf(w,s.reps)>bw.maxE) out.push('Est. 1RM');
  if(w in bw.repsAt && s.reps>bw.repsAt[w]) out.push(w>0 ? 'Reps at '+w+' lb' : 'Reps (bodyweight)');
  return out;
}
// Returns {setIndex: [labels]} for sets in this instance that beat everything logged before it.
function computePRsForInstance(inst, workout, sessions){
  const b = prBestsEmpty();
  (sessions || getExerciseSessions(inst.exerciseId)).forEach(ses=>{
    if(ses.workout.id===workout.id || !sessionsBefore(ses.workout, workout)) return;
    const t = ses.inst.secondaryType || 'weight';
    ses.inst.sets.forEach(x=>{ if(isCounted(x)) prAbsorb(b, x, t); });
  });
  const type = inst.secondaryType || 'weight';
  const bySet = {};
  (inst.sets||[]).forEach((x,i)=>{
    if(!isCounted(x)) return;
    const labels = prCheck(b, x, type);
    if(labels.length) bySet[i] = labels;
    prAbsorb(b, x, type);
  });
  return bySet;
}

function calcSetLoad(set, secondaryType){
  // Weight: reps × weight. Band: reps only (resistance isn't comparable across colors).
  // Time: total seconds (more time = more work for a hold/timed set).
  if(secondaryType==='time') return set.time || 0;
  if(secondaryType==='band') return set.reps || 0;
  return (set.reps || 0) * (set.weight || 0);
}
function workingSets(sets){ return (sets||[]).filter(isCounted); }

function calcTotalLoad(sets, secondaryType, upToCount){
  const slice = upToCount!=null ? sets.slice(0, upToCount) : sets;
  return slice.reduce((sum, s)=> sum + calcSetLoad(s, secondaryType), 0);
}

function computeLoadDelta(inst, secondaryType){
  // Compares load-so-far against the same number of sets from the last time
  // this exercise was logged, so a partially-completed workout isn't penalized.
  const def = getExerciseDef(inst.exerciseId);
  if(!def) return null;
  const last = findLastInstance(def.id, currentWorkoutId);
  if(!last || !last.sets || last.sets.length===0) return null;

  const curWork = workingSets(inst.sets);
  const priorWork = workingSets(last.sets);
  const completedCount = curWork.length;
  if(completedCount===0 || priorWork.length===0) return null;

  const currentLoad = calcTotalLoad(curWork, secondaryType);
  const priorLoad = calcTotalLoad(priorWork, secondaryType, Math.min(completedCount, priorWork.length));
  if(priorLoad<=0) return null;

  const pct = Math.round(((currentLoad - priorLoad) / priorLoad) * 100);
  return pct;
}

function formatLoadDelta(pct){
  if(pct===null || pct===undefined) return '';
  if(pct===0) return ' <span class="delta-steady">· steady</span>';
  const cls = pct>0 ? 'delta-up' : 'delta-down';
  const arrow = pct>0 ? '▲' : '▼';
  const sign = pct>0 ? '+' : '';
  return ` <span class="${cls}">· ${arrow} ${sign}${pct}%</span>`;
}
